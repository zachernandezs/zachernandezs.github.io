/* =====================================================================
   Pomodoro
   ===================================================================== */
const Pomo = (() => {
  const DEF = { focus: 25, short: 5, long: 15, every: 4, autoBreak: true, autoFocus: false, notify: false, sound: 'bell', volume: 0.7 };
  let P = store.get('timer', null) || {};
  P.cfg = Object.assign({}, DEF, P.cfg || {});
  const st = Object.assign({ mode: 'focus', running: false, endAt: 0, left: P.cfg.focus * 6e4, round: 1, day: ymd(new Date()), count: 0, focusMs: 0 }, P.st || {});
  P.st = st;
  const cfg = P.cfg;
  const save = () => store.set('timer', P);
  const dur = m => cfg[m] * 6e4;
  const LABEL = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  const C = 2 * Math.PI * 88;
  const prog = $('#pm-prog');
  prog.style.strokeDasharray = C;
  let AC = null, sched = null, lastSec = -1;

  // bezel ticks
  $('#pm-ticks').innerHTML = Array.from({ length: 60 }, (_, i) => {
    const a = i / 60 * Math.PI * 2, mj = i % 5 === 0, r0 = mj ? 97 : 99, r1v = 103;
    return `<line class="pm-tk${mj ? ' mj' : ''}" x1="${(110 + Math.sin(a) * r0).toFixed(2)}" y1="${(110 - Math.cos(a) * r0).toFixed(2)}" x2="${(110 + Math.sin(a) * r1v).toFixed(2)}" y2="${(110 - Math.cos(a) * r1v).toFixed(2)}"/>`;
  }).join('');

  /* sound: synthesised so the file works offline */
  function audio() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!AC) AC = new Ctx();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function partial(ac, out, f, t, peak, decay, type = 'sine') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o.connect(g).connect(out); o.start(t); o.stop(t + decay + 0.05);
  }
  const SOUNDS = {
    bell(ac, out, t) {
      for (const [dt, f] of [[0, 880], [0.9, 880], [1.8, 1174.7]]) {
        [[1, .5, 2.6], [2, .22, 1.7], [2.76, .16, 1.2], [4.07, .08, .8], [5.4, .05, .55]].forEach(([k, a, d]) => partial(ac, out, f * k, t + dt, a, d));
      }
    },
    chime(ac, out, t) {
      const notes = [659.25, 830.61, 987.77, 1318.51];
      for (const rep of [0, 1.5]) notes.forEach((f, i) => { partial(ac, out, f, t + rep + i * 0.17, .32, 1.9); partial(ac, out, f * 2.01, t + rep + i * 0.17, .06, .7); });
    },
    bowl(ac, out, t) {
      for (const dt of [0, 3.2]) [[196, .42, 6], [196.7, .3, 6], [531, .16, 4], [532.2, .1, 4], [1012, .06, 2.4]].forEach(([f, a, d]) => partial(ac, out, f, t + dt, a, d));
    },
    digital(ac, out, t) {
      for (let g = 0; g < 3; g++) for (let b = 0; b < 4; b++) partial(ac, out, 1046.5, t + g * 1.1 + b * 0.13, .16, .09, 'square');
    }
  };
  function play(at, name = cfg.sound) {
    const ac = audio(); if (!ac) return null;
    const out = ac.createGain(); out.gain.value = cfg.volume; out.connect(ac.destination);
    SOUNDS[name](ac, out, Math.max(ac.currentTime + 0.03, at == null ? 0 : at));
    return out;
  }
  // The chime is scheduled on the audio clock when a session starts, so it rings on time even in a background tab.
  function schedule() {
    cancelChime();
    const ac = audio(); if (!ac) return;
    const out = play(ac.currentTime + (st.endAt - Date.now()) / 1000);
    if (out) sched = { out, at: st.endAt };
  }
  function cancelChime() { if (sched) { try { sched.out.disconnect(); } catch (e) { } sched = null; } }

  function rollDay() { const d = ymd(new Date()); if (st.day !== d) { st.day = d; st.count = 0; st.focusMs = 0; } }
  function start() { if (st.running) return; st.running = true; st.endAt = Date.now() + st.left; schedule(); render(); save(); }
  function pause() { if (!st.running) return; st.left = Math.max(0, st.endAt - Date.now()); st.running = false; cancelChime(); render(); save(); }
  function reset() { st.running = false; st.left = dur(st.mode); cancelChime(); render(); save(); }
  function setMode(m) { st.mode = m; st.running = false; st.left = dur(m); cancelChime(); render(); save(); }
  function next(natural) {
    const was = st.mode;
    if (was === 'focus') {
      if (natural) { rollDay(); st.count++; st.focusMs += dur('focus'); }
      st.mode = st.round >= cfg.every ? 'long' : 'short';
    } else {
      st.round = was === 'long' ? 1 : st.round + 1;
      st.mode = 'focus';
    }
    st.running = false; st.left = dur(st.mode);
    const auto = st.mode === 'focus' ? cfg.autoFocus : cfg.autoBreak;
    if (auto && natural) start();
    render(); save();
    return was;
  }
  function complete(late) {
    const chimed = sched && Math.abs(sched.at - st.endAt) < 1500 && !late;
    sched = null;
    const was = next(true);
    if (!chimed && !late) play();
    const msg = was === 'focus'
      ? `Focus session done. Time for a ${cfg[st.mode]}-minute ${st.mode === 'long' ? 'long ' : ''}break.`
      : 'Break is over. Ready for the next focus session?';
    toast(late ? 'Your session ended while Dotdesk was closed.' : msg, { ms: 8000 });
    const w = $('#w-timer'); w.classList.remove('ding'); void w.offsetWidth; w.classList.add('ding');
    if (cfg.notify && !late && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification('Dotdesk', { body: msg, silent: true }); } catch (e) { }
    }
  }
  const digits = s => s.split('').map(c => c === ':' ? ':' : `<span class="dg">${c}</span>`).join('');
  const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
  function remaining() { return st.running ? Math.max(0, st.endAt - Date.now()) : st.left; }
  function render() {
    const left = remaining(), d = dur(st.mode);
    $('#pm').dataset.mode = st.mode;
    $$('#pm-modes button').forEach(b => { b.classList.toggle('on', b.dataset.mode === st.mode); b.setAttribute('aria-pressed', b.dataset.mode === st.mode); });
    $('#pm-time').innerHTML = digits(mmss(left));
    $('#pm-time').setAttribute('aria-label', `${Math.ceil(left / 60000)} minutes left`);
    $('#pm-label').textContent = st.mode === 'focus' ? `Focus · ${st.round} of ${cfg.every}` : LABEL[st.mode];
    prog.style.strokeDashoffset = (C * (1 - clamp(left / d, 0, 1))).toFixed(2);
    const go = $('#pm-go');
    go.innerHTML = ico(st.running ? 'pause' : 'play');
    go.setAttribute('aria-label', st.running ? 'Pause' : (left < d ? 'Resume' : 'Start'));
    go.title = st.running ? 'Pause (Alt+P)' : 'Start (Alt+P)';
    $('#pm-dots').innerHTML = Array.from({ length: cfg.every }, (_, i) => {
      const n = i + 1, done = n < st.round || (n === st.round && st.mode !== 'focus');
      return `<i class="${done ? 'on' : ''}${n === st.round && st.mode === 'focus' ? ' cur' : ''}"></i>`;
    }).join('');
    rollDay();
    const mins = Math.round(st.focusMs / 6e4);
    $('#pm-today').textContent = `Today: ${st.count} session${st.count === 1 ? '' : 's'} · ${mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${mins} min`}`;
    const pill = $('#ck-pomo');
    pill.hidden = !st.running && left === d;
    pill.classList.toggle('brk', st.mode !== 'focus');
    pill.innerHTML = `<i></i>${LABEL[st.mode]} · ${mmss(left)}${st.running ? '' : ' paused'}`;
    pomoTitle = st.running ? `${mmss(left)} · ${LABEL[st.mode]}` : '';
    setTitle();
  }
  function tick() {
    if (st.running && Date.now() >= st.endAt) { complete(false); return; }
    const s = Math.ceil(remaining() / 1000);
    if (s !== lastSec) { lastSec = s; render(); }
  }
  // settings form
  const form = $('#pm-form');
  const F = { focus: '#pm-f-focus', short: '#pm-f-short', long: '#pm-f-long', every: '#pm-f-every' };
  function fillForm() {
    for (const k in F) $(F[k]).value = cfg[k];
    $('#pm-f-ab').checked = cfg.autoBreak; $('#pm-f-af').checked = cfg.autoFocus; $('#pm-f-nt').checked = cfg.notify;
    $('#pm-f-snd').value = cfg.sound; $('#pm-f-vol').value = cfg.volume;
  }
  function showForm(on) { form.hidden = !on; $('#pm-main').hidden = on; $('#pm-cfg-btn').classList.toggle('on', on); if (on) { fillForm(); $(F.focus).focus(); } }
  form.addEventListener('input', e => {
    for (const k in F) { const v = parseInt($(F[k]).value, 10); if (v > 0) cfg[k] = clamp(v, +$(F[k]).min, +$(F[k]).max); }
    cfg.autoBreak = $('#pm-f-ab').checked; cfg.autoFocus = $('#pm-f-af').checked;
    cfg.sound = $('#pm-f-snd').value; cfg.volume = +$('#pm-f-vol').value;
    if (e.target.id === 'pm-f-nt') {
      cfg.notify = e.target.checked;
      if (cfg.notify && 'Notification' in window && Notification.permission !== 'granted') {
        try {
          Notification.requestPermission().then(p => { if (p !== 'granted') { cfg.notify = false; e.target.checked = false; toast("Notifications are blocked for this page, so Dotdesk will use the chime only."); save(); } });
        } catch (er) { cfg.notify = false; e.target.checked = false; }
      } else if (cfg.notify && !('Notification' in window)) { cfg.notify = false; e.target.checked = false; toast("This browser doesn't support desktop notifications here."); }
    }
    if (st.round > cfg.every) st.round = 1;
    if (!st.running) st.left = dur(st.mode);
    if (sched && st.running) schedule();
    render(); save();
  });
  form.addEventListener('submit', e => { e.preventDefault(); showForm(false); });
  $('#pm-test').onclick = () => play();
  $('#pm-cfg-btn').onclick = () => showForm(form.hidden);
  $('#pm-go').onclick = () => st.running ? pause() : start();
  $('#pm-reset').onclick = reset;
  $('#pm-skip').onclick = () => { cancelChime(); next(false); };
  $('#pm-modes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b && b.dataset.mode !== st.mode) setMode(b.dataset.mode); });
  $('#ck-pomo').addEventListener('click', () => setWin('timer', true));

  if (st.running && Date.now() >= st.endAt) { setTimeout(() => complete(true), 600); }
  else if (st.running) { /* resumes counting; chime is re-armed on the first click anywhere */
    document.addEventListener('pointerdown', function arm() { if (st.running && !sched) schedule(); document.removeEventListener('pointerdown', arm, true); }, true);
  }
  render();
  return { tick, toggle: () => st.running ? pause() : start(), render };
})();

/* =====================================================================
   Tasks: daily / weekly / bi-weekly
   ===================================================================== */
const Tasks = (() => {
  const COLS = [
    { id: 'daily', name: 'Daily', c: 'var(--orange)', ph: 'Add a daily task' },
    { id: 'weekly', name: 'Weekly', c: 'var(--yellow)', ph: 'Add a weekly task' },
    { id: 'biweekly', name: 'Bi-weekly', c: 'var(--green)', ph: 'Add a bi-weekly task' }
  ];
  let T = store.get('tasks', null);
  const save = () => store.set('tasks', T);
  const host = $('#tk-cols');
  let dragId = null;

  function ensure(sample) {
    if (!T) {
      const ws = weekStartOf(new Date(), 1);
      T = { weekStart: 1, anchor: ymd(ws), cols: {} };
      for (const c of COLS) T.cols[c.id] = { items: (sample && sample[c.id]) || [], key: '', reset: 'uncheck' };
    }
    for (const c of COLS) if (!T.cols[c.id]) T.cols[c.id] = { items: [], key: '', reset: 'uncheck' };
  }
  function period(id, now = new Date()) {
    const d = sod(now);
    if (id === 'daily') return [d, addDays(d, 1)];
    const ws = weekStartOf(d, T.weekStart);
    if (id === 'weekly') return [ws, addDays(ws, 7)];
    const a = parseYmd(T.anchor), k = Math.floor(dayDiff(ws, a) / 14), s = addDays(a, k * 14);
    return [s, addDays(s, 14)];
  }
  const m3 = d => MONS[d.getMonth()].slice(0, 3);
  function rangeLabel(s, e) {
    const l = addDays(e, -1);
    return s.getMonth() === l.getMonth() ? `${m3(s)} ${s.getDate()} – ${l.getDate()}` : `${m3(s)} ${s.getDate()} – ${m3(l)} ${l.getDate()}`;
  }
  function label(id) {
    const [s, e] = period(id);
    if (id === 'daily') return `${DOWS[s.getDay()].slice(0, 3)}, ${m3(s)} ${s.getDate()}`;
    if (id === 'weekly') return `${rangeLabel(s, e)} · W${isoWeek(addDays(s, 3))}`;
    return `${rangeLabel(s, e)} · W${isoWeek(addDays(s, 3))}–${isoWeek(addDays(s, 10))}`;
  }
  function until(id) {
    const ms = period(id)[1] - Date.now(), m = Math.max(1, Math.round(ms / 6e4));
    if (m < 60) return `resets in ${m} min`;
    const h = Math.round(m / 60);
    return h < 36 ? `resets in ${h} h` : `resets in ${Math.round(h / 24)} days`;
  }
  function rollover() {
    let changed = false;
    for (const c of COLS) {
      const col = T.cols[c.id], key = ymd(period(c.id)[0]);
      if (col.key !== key) {
        if (col.key) {
          if (col.reset === 'remove') col.items = col.items.filter(i => !i.done);
          else col.items.forEach(i => { i.done = false; });
        }
        col.key = key; changed = true;
      }
    }
    if (changed) { save(); render(); }
  }
  function render() {
    let done = 0, total = 0;
    host.innerHTML = COLS.map(c => {
      const col = T.cols[c.id], n = col.items.filter(i => i.done).length;
      done += n; total += col.items.length;
      const pct = col.items.length ? Math.round(n / col.items.length * 100) : 0;
      return `<div class="tcol" data-col="${c.id}" style="--c:${c.c}">
        <div class="tcol-head"><h3>${c.name}</h3><span class="tcount">${n}/${col.items.length}</span><button class="ib" data-colmenu="${c.id}" title="${c.name} options" aria-label="${c.name} options">${ico('more')}</button></div>
        <div class="tcol-sub" title="${esc(label(c.id))} · ${until(c.id)}">${esc(label(c.id))} · ${until(c.id)}</div>
        <div class="tbar"><i style="width:${pct}%"></i></div>
        <ul class="tlist" data-col="${c.id}" aria-label="${c.name} tasks">${col.items.map(i => `<li class="tki${i.done ? ' done' : ''}" draggable="true" data-id="${i.id}"><button class="tcheck" role="checkbox" aria-checked="${!!i.done}" aria-label="Mark done">${ico('check')}</button><span class="ttext">${esc(i.text)}</span><button class="tdel" title="Delete" aria-label="Delete task">${ico('x')}</button></li>`).join('')}</ul>
        <form class="tadd" data-col="${c.id}">${ico('plus')}<input id="tk-add-${c.id}" placeholder="${c.ph}" aria-label="${c.ph}" autocomplete="off"></form>
      </div>`;
    }).join('');
    $('#tk-sum').textContent = total ? `${done} of ${total} done` : '';
  }
  function find(id) {
    for (const c of COLS) { const items = T.cols[c.id].items, i = items.findIndex(x => x.id === id); if (i >= 0) return { col: c.id, items, i, item: items[i] }; }
    return null;
  }
  function refocusAdd(col) { const inp = $('#tk-add-' + col); if (inp) inp.focus(); }
  host.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.closest('.tadd'), inp = $('input', f), text = inp.value.trim();
    if (!text) return;
    T.cols[f.dataset.col].items.push({ id: uid(), text, done: false });
    save(); render(); refocusAdd(f.dataset.col);
  });
  host.addEventListener('click', e => {
    const cm = e.target.closest('[data-colmenu]');
    if (cm) {
      const col = T.cols[cm.dataset.colmenu];
      menu(cm, [
        { label: 'When the period resets', heading: true },
        { label: 'Uncheck done tasks', checked: col.reset !== 'remove', fn: () => { col.reset = 'uncheck'; save(); } },
        { label: 'Remove done tasks', checked: col.reset === 'remove', fn: () => { col.reset = 'remove'; save(); } },
        '-',
        { label: 'Uncheck all now', icon: 'reset', fn: () => { col.items.forEach(i => { i.done = false; }); save(); render(); } },
        { label: 'Remove done tasks now', icon: 'trash', fn: () => { col.items = col.items.filter(i => !i.done); save(); render(); } }
      ]);
      return;
    }
    const li = e.target.closest('.tki'); if (!li) return;
    const f = find(li.dataset.id); if (!f) return;
    if (e.target.closest('.tcheck')) { f.item.done = !f.item.done; f.item.sample = false; save(); render(); const b = $(`.tki[data-id="${f.item.id}"] .tcheck`, host); if (b) b.focus(); }
    else if (e.target.closest('.tdel')) {
      f.items.splice(f.i, 1); save(); render();
      toast(`Deleted “${f.item.text}”`, { action: { label: 'Undo', fn: () => { T.cols[f.col].items.splice(f.i, 0, f.item); save(); render(); } } });
    }
  });
  host.addEventListener('dblclick', e => {
    const tx = e.target.closest('.ttext'); if (!tx) return;
    const li = tx.closest('.tki'), f = find(li.dataset.id); if (!f) return;
    li.draggable = false; tx.contentEditable = 'true'; tx.focus();
    const r = document.createRange(); r.selectNodeContents(tx); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    let done = false;
    const commit = ok => {
      if (done) return; done = true;
      const v = tx.textContent.trim();
      if (ok && v) f.item.text = v;
      if (ok && !v) f.items.splice(f.items.indexOf(f.item), 1);
      save(); render();
    };
    tx.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(true); } if (ev.key === 'Escape') { ev.preventDefault(); commit(false); } });
    tx.addEventListener('blur', () => commit(true), { once: true });
  });
  // drag to reorder, move between columns, or drop text in from elsewhere
  host.addEventListener('dragstart', e => {
    const li = e.target.closest('.tki'); if (!li) return;
    dragId = li.dataset.id; li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', $('.ttext', li).textContent);
  });
  host.addEventListener('dragend', () => { dragId = null; clearMarks(); $$('.tki.dragging', host).forEach(x => x.classList.remove('dragging')); });
  const clearMarks = () => { $$('.drop-before', host).forEach(x => x.classList.remove('drop-before')); $$('.drop-end', host).forEach(x => x.classList.remove('drop-end')); };
  function dropTarget(list, y) { return $$('.tki:not(.dragging)', list).find(li => y < li.getBoundingClientRect().top + li.offsetHeight / 2) || null; }
  host.addEventListener('dragover', e => {
    const list = e.target.closest('.tcol') && $('.tlist', e.target.closest('.tcol')); if (!list) return;
    e.preventDefault(); e.dataTransfer.dropEffect = dragId ? 'move' : 'copy';
    clearMarks();
    const before = dropTarget(list, e.clientY);
    if (before) before.classList.add('drop-before'); else list.classList.add('drop-end');
  });
  host.addEventListener('dragleave', e => { if (!host.contains(e.relatedTarget)) clearMarks(); });
  host.addEventListener('drop', e => {
    const colEl = e.target.closest('.tcol'); if (!colEl) return;
    e.preventDefault();
    const list = $('.tlist', colEl), before = dropTarget(list, e.clientY), to = T.cols[colEl.dataset.col].items;
    clearMarks();
    let item;
    if (dragId) { const f = find(dragId); if (!f) return; item = f.item; f.items.splice(f.i, 1); }
    else {
      const text = (e.dataTransfer.getData('text/plain') || '').trim().split('\n')[0].replace(/^\s*([-*+]|\d+[.)])\s+(\[[ xX]\]\s*)?/, '').trim();

  }
  $('#tk-more').onclick = e => menu(e.currentTarget, [
    { label: 'Copy as Markdown', icon: 'copy', fn: () => copyText(markdown(), 'Task lists copied as Markdown.') },
    { label: 'Insert into notepad', icon: 'notebook', fn: () => { setWin('notes', true); Notes.appendBlock(markdown() + '\n'); } },
    '-',
    { label: 'Weeks start on', heading: true },
    { label: 'Monday', checked: T.weekStart === 1, fn: () => setWeekStart(1) },
    { label: 'Sunday', checked: T.weekStart === 0, fn: () => setWeekStart(0) }

  function setWeekStart(ws) {
    T.weekStart = ws;
    T.anchor = ymd(weekStartOf(parseYmd(T.anchor), ws));

})();

/* =====================================================================
   Day plan: block out one day in half-hour slots
   ===================================================================== */
const Plan = (() => {
  const SLOT = 20, N = 48;
  const COLORS = [null, '#f0a033', '#e6c24b', '#4fc76a', '#ef5d6c', '#a88bfa', '#f472b6', '#8c9096'];
  let P = store.get('plan', null);
  if (!P || typeof P.days !== 'object' || !P.days) P = { days: {} };
  {
    const cutoff = ymd(addDays(new Date(), -90));
    for (const k of Object.keys(P.days)) if (k < cutoff || !Array.isArray(P.days[k]) || !P.days[k].length) delete P.days[k];
  }
  const save = debounce(() => store.set('plan', P), 200);
  const scroller = $('#pl-scroll'), lane = $('#pl-track');
  let day = ymd(new Date()), follow = true, dragId = null, editing = null, commitFn = null, scrolledFor = null, lastMin = -1;
  const list = () => P.days[day] || (P.days[day] = []);

  const hourLabel = h => S.h24 ? `${pad(h)}:00` : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
  const tLabel = s => {
    const h = Math.floor(s / 2), m = s % 2 ? '30' : '00';
    return S.h24 ? `${pad(h)}:${m}` : `${h % 12 || 12}:${m} ${h % 24 < 12 ? 'AM' : 'PM'}`;
  };
  const durLabel = n => { const h = Math.floor(n / 2); return h ? `${h} h${n % 2 ? ' 30 min' : ''}` : '30 min'; };

  function buildGrid() {
    const H = N * SLOT + 'px';
    lane.style.height = H; $('#pl-hours').style.height = H;
    let lines = '';
    for (let s = 0; s <= N; s++) lines += `<div class="pl-line${s % 2 ? ' half' : ''}" style="top:${s * SLOT}px"></div>`;
    $('#pl-lines').innerHTML = lines;
    $('#pl-hours').innerHTML = Array.from({ length: 24 }, (_, h) => `<span data-h="${h}" style="top:${h * 2 * SLOT}px">${hourLabel(h)}</span>`).join('');
  }
  // side-by-side columns for blocks that overlap in time
  function layout(evs) {
    const out = new Map();
    let cluster = [], ends = [], clusterEnd = -1;
    const flush = () => { cluster.forEach(c => out.set(c.id, { col: c.col, n: ends.length })); cluster = []; ends = []; };
    for (const ev of evs.slice().sort((a, b) => a.s - b.s || b.e - a.e)) {
      if (ev.s >= clusterEnd) { flush(); clusterEnd = -1; }
      let col = ends.findIndex(end => end <= ev.s);
      if (col < 0) { col = ends.length; ends.push(ev.e); } else ends[col] = ev.e;
      cluster.push({ id: ev.id, col }); clusterEnd = Math.max(clusterEnd, ev.e);
    }
    flush();
    return out;
  }
  function renderHead() {
    const now = new Date(), d = parseYmd(day), today = ymd(now);
    const rel = day === today ? 'Today' : day === ymd(addDays(now, 1)) ? 'Tomorrow' : day === ymd(addDays(now, -1)) ? 'Yesterday' : '';
    $('#pl-date').innerHTML = rel
      ? `<b>${rel}</b> · ${DOWS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MONS[d.getMonth()].slice(0, 3)}`
      : `<b>${DOWS[d.getDay()]}</b> · ${d.getDate()} ${MONS[d.getMonth()].slice(0, 3)}`;
    $('#pl-date').classList.toggle('today', day === today);
    $('#pl-today').classList.toggle('off', day !== today);
  }
  function renderNow() {
    const now = new Date(), t = ymd(now), isToday = day === t;
    const y = (now.getHours() * 60 + now.getMinutes()) / 30 * SLOT;
    const nl = $('#pl-now'); nl.hidden = !isToday; nl.style.top = y + 'px';
    $('#pl-past').style.height = (day < t ? N * SLOT : isToday ? y : 0) + 'px';
    $$('#pl-hours span').forEach(s => s.classList.toggle('now', isToday && +s.dataset.h === now.getHours()));
  }
  function render() {
    const evs = list(), pos = layout(evs);
    $('#pl-evs').innerHTML = evs.map(ev => {
      const p = pos.get(ev.id), n = ev.e - ev.s;
      return `<div class="pl-ev${n === 1 ? ' short' : n === 2 ? ' mid' : ' tall'}${ev.id === dragId ? ' dragging' : ''}" data-id="${ev.id}" style="--lines:${Math.max(1, Math.floor((n * SLOT - 24) / 16))};top:${ev.s * SLOT + 1}px;height:${n * SLOT - 2}px;left:calc(${p.col / p.n * 100}% + 2px);width:calc(${100 / p.n}% - 4px);--ec:${ev.color || 'var(--accent)'}" title="${esc(ev.title || 'Untitled')} · ${tLabel(ev.s)}–${tLabel(ev.e)}">
        <div class="pl-ev-t">${esc(ev.title || 'Untitled')}</div>
        <div class="pl-ev-time">${n === 1 ? tLabel(ev.s) : `${tLabel(ev.s)} – ${tLabel(ev.e)}`}</div>
        <button class="pl-ev-x" data-act="del" title="Delete" aria-label="Delete ${esc(ev.title || 'block')}">${ico('x')}</button>
        <button class="pl-ev-c" data-act="color" title="Change color" aria-label="Change color"><span></span></button>
        <div class="pl-ev-rs top" data-rs="top"></div><div class="pl-ev-rs bot" data-rs="bot"></div>
      </div>`;
    }).join('');
    const total = evs.reduce((a, ev) => a + ev.e - ev.s, 0);
    $('#pl-foot').textContent = evs.length
      ? `${evs.length} block${evs.length === 1 ? '' : 's'} · ${durLabel(total)} planned`
      : 'Drag on the grid to block out time. Click a block to rename it.';
    renderHead(); renderNow();
  }
  function scrollToFocus() {
    if (scrolledFor === day || !scroller.clientHeight) return;
    scrolledFor = day;
    const now = new Date(), evs = list();
    let target;
    if (day === ymd(now)) target = (now.getHours() * 2 + (now.getMinutes() >= 30 ? 1 : 0)) * SLOT - scroller.clientHeight * 0.3;
    else if (evs.length) target = Math.min(...evs.map(e => e.s)) * SLOT - 24;
    else target = 16 * SLOT;
    scroller.scrollTop = Math.max(0, target);
  }
  function go(d) {
    commitEdit();
    day = d; follow = d === ymd(new Date()); scrolledFor = null;
    render(); scrollToFocus();
  }

  /* editing a block's title */
  function startEdit(id, fresh = false) {
    const el = $(`.pl-ev[data-id="${id}"]`, lane), ev = list().find(x => x.id === id);
    if (!el || !ev) return;
    const d0 = day;
    editing = id; el.classList.add('editing');
    const t = $('.pl-ev-t', el);
    t.innerHTML = '<input id="pl-title" aria-label="Block title" maxlength="80" placeholder="What will you do?" autocomplete="off">';
    const inp = $('input', t);
    inp.value = ev.title || '';
    inp.focus({ preventScroll: true }); inp.select();
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true; editing = null; commitFn = null;
      const v = inp.value.trim();
      if (ok && v) { ev.title = v; ev.sample = false; }
      if (!ev.title) { const arr = P.days[d0] || []; const i = arr.indexOf(ev); if (i >= 0) arr.splice(i, 1); }
      save(); render();
    };
    commitFn = () => finish(true);
    inp.addEventListener('keydown', k => {
      k.stopPropagation();
      if (k.key === 'Enter') { k.preventDefault(); finish(true); }
      else if (k.key === 'Escape') { k.preventDefault(); finish(false); }
    });
    inp.addEventListener('blur', () => finish(true));
  }
  function commitEdit() { if (commitFn) commitFn(); }

  /* pointer: drag on empty grid to create, drag a block to move, drag its edges to resize */
  const slotAt = y => clamp(Math.floor((y - lane.getBoundingClientRect().top) / SLOT), 0, N - 1);
  function edgeScroll(y) {
    const r = scroller.getBoundingClientRect();
    if (y < r.top + 28) scroller.scrollTop -= 14; else if (y > r.bottom - 28) scroller.scrollTop += 14;
  }
  lane.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const evEl = e.target.closest('.pl-ev');
    if (evEl) { blockDown(e, evEl); return; }
    e.preventDefault();
    commitEdit();
    const s0 = slotAt(e.clientY);
    const ghost = document.createElement('div');
    ghost.className = 'pl-ghost'; lane.append(ghost);
    let a = s0, b = Math.min(N, s0 + 2), moved = false;
    const draw = () => {
      ghost.style.top = a * SLOT + 1 + 'px'; ghost.style.height = (b - a) * SLOT - 2 + 'px';
      ghost.textContent = `${tLabel(a)} – ${tLabel(b)}`;
    };
    draw();
    track(e, ev => {
      edgeScroll(ev.clientY);
      const s1 = slotAt(ev.clientY);
      if (s1 !== s0) moved = true;
      if (!moved) return;
      a = Math.min(s0, s1); b = Math.max(s0, s1) + 1; draw();
    }, () => {
      ghost.remove();
      const ev = { id: uid(), s: a, e: b, title: '', color: null };
      list().push(ev); save(); render();
      startEdit(ev.id, true);
    });
  });
  function blockDown(e, el) {
    if (e.target.closest('[data-act]') || e.target.closest('input')) return;
    const id = el.dataset.id, ev = list().find(x => x.id === id); if (!ev) return;
    e.preventDefault();
    if (editing && editing !== id) commitEdit();
    // resize zones are measured from the block edges so the border pixel counts too
    const r = el.getBoundingClientRect(), short = ev.e - ev.s === 1;
    const rs = e.clientY >= r.bottom - (short ? 5 : 8) ? { dataset: { rs: 'bot' } } : !short && e.clientY <= r.top + 6 ? { dataset: { rs: 'top' } } : null;
    const y0 = e.clientY, sc0 = scroller.scrollTop, s0 = ev.s, e0 = ev.e;
    let moved = false;
    track(e, m => {
      edgeScroll(m.clientY);
      const dy = m.clientY - y0 + scroller.scrollTop - sc0;
      if (!moved && Math.abs(dy) < 5) return;
      if (!moved) { moved = true; if (editing === id) commitEdit(); dragId = id; }
      const d = Math.round(dy / SLOT);
      if (!rs) { const len = e0 - s0; ev.s = clamp(s0 + d, 0, N - len); ev.e = ev.s + len; }
      else if (rs.dataset.rs === 'top') ev.s = clamp(s0 + d, 0, ev.e - 1);
      else ev.e = clamp(e0 + d, ev.s + 1, N);
      render();
    }, () => {
      dragId = null;
      if (moved) { ev.sample = false; save(); render(); }
      else if (editing !== id) startEdit(id);
    });
  }
  lane.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const el = b.closest('.pl-ev'), d0 = day, arr = list(), i = arr.findIndex(x => x.id === el.dataset.id);
    if (i < 0) return;
    const ev = arr[i];
    if (b.dataset.act === 'del') {
      arr.splice(i, 1); save(); render();
      toast(`Removed “${ev.title || 'Untitled'}”`, { action: { label: 'Undo', fn: () => { (P.days[d0] || (P.days[d0] = [])).push(ev); save(); if (day === d0) render(); } } });
    } else {
      ev.color = COLORS[(COLORS.indexOf(ev.color || null) + 1) % COLORS.length];
      save(); render();
    }
  });

  /* header + menu */
  $('#pl-prev').onclick = () => go(ymd(addDays(parseYmd(day), -1)));
  $('#pl-next').onclick = () => go(ymd(addDays(parseYmd(day), 1)));
  $('#pl-today').onclick = () => go(ymd(new Date()));
  function markdown() {
    const d = parseYmd(day), evs = list().slice().sort((a, b) => a.s - b.s);
    return `### Day plan · ${DOWS[d.getDay()]} ${d.getDate()} ${MONS[d.getMonth()]}\n` +
      (evs.map(ev => `- ${tLabel(ev.s)}–${tLabel(ev.e)} ${ev.title || 'Untitled'}`).join('\n') || '- Nothing planned');
  }
  $('#pl-more').onclick = e => {
    const has = list().length, prevKey = ymd(addDays(parseYmd(day), -1)), prev = P.days[prevKey] || [];
    menu(e.currentTarget, [
      { label: 'Copy as Markdown', icon: 'copy', disabled: !has, fn: () => copyText(markdown(), 'Day plan copied as Markdown.') },
      { label: 'Insert into notepad', icon: 'notebook', disabled: !has, fn: () => { setWin('notes', true); Notes.appendBlock(markdown() + '\n'); } },
      { label: 'Copy blocks from the day before', icon: 'redo', disabled: !prev.length, fn: () => {
        const arr = list();
        prev.forEach(ev => { if (!arr.some(x => x.s === ev.s && x.e === ev.e && x.title === ev.title)) arr.push({ id: uid(), s: ev.s, e: ev.e, title: ev.title, color: ev.color || null }); });
        save(); render(); toast(`Copied ${prev.length} block${prev.length === 1 ? '' : 's'} from the day before.`);
      } },
      '-',
      { label: 'Clear this day', icon: 'trash', disabled: !has, fn: () => {
        const d0 = day, old = list().slice();
        P.days[d0] = []; save(); render();
        toast(`Cleared ${old.length} block${old.length === 1 ? '' : 's'}.`, { action: { label: 'Undo', fn: () => { P.days[d0] = old.concat(P.days[d0] || []); save(); if (day === d0) render(); } } });
      } }
    ]);
  };

  winShown.plan = scrollToFocus;
  buildGrid(); render();
  return {
    refresh() { buildGrid(); render(); },
    tick(now) {
      if (now.getMinutes() === lastMin) return;
      lastMin = now.getMinutes();
      if (follow && day !== ymd(now) && !editing) { day = ymd(now); scrolledFor = null; render(); scrollToFocus(); return; }
      renderNow(); renderHead();
    },
    seed(blocks) { if (!blocks) return; P.days[ymd(new Date())] = blocks; save(); render(); },
    clearSamples() { for (const k of Object.keys(P.days)) P.days[k] = P.days[k].filter(ev => !ev.sample); save(); render(); }
  };
})();

/* =====================================================================
   Clock + calendar
   ===================================================================== */
const Cal = (() => {
  let month = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })();
  let today = ymd(new Date()), lastMin = -1;
  const dotCache = new Map();
  function renderFace(now) {
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    if (lastMin !== m) {
      lastMin = m;
      const hh = S.h24 ? pad(h) : String(h % 12 || 12);
      $('#ck-hm').innerHTML = `${hh}<span class="ck-colon">:</span>${pad(m)}`;
      $('#ck-ap').textContent = S.h24 ? '' : (h < 12 ? 'AM' : 'PM');
      $('#ck-day').innerHTML = `<b>${DOWS[now.getDay()]}</b> · ${now.getDate()} ${MONS[now.getMonth()].slice(0, 3)} · W${isoWeek(now)}`;
      $('#ck-day').title = `${DOWS[now.getDay()]} ${now.getDate()} ${MONS[now.getMonth()]} ${now.getFullYear()}, week ${isoWeek(now)}`;
    }
    $('#ck-ss').textContent = S.seconds ? pad(s) : '';
    const frac = (now - sod(now)) / 864e5 * 100;
    $('#ck-fill').style.width = frac + '%';
    $('#ck-knob').style.left = frac + '%';
  }
  function render() {
    const now = new Date(), ws = S.calWeekStart || 0;
    $('#ck-mon').innerHTML = `<b>${MONS[month.getMonth()].slice(0, 3).toUpperCase()}</b> ${month.getFullYear()}`;
    const isCur = month.getFullYear() === now.getFullYear() && month.getMonth() === now.getMonth();
    $('#cal-today').classList.toggle('off', !isCur);
    $('#cal-dow').innerHTML = Array.from({ length: 7 }, (_, i) => `<span>${DOWS[(i + ws) % 7].slice(0, 3).toUpperCase()}</span>`).join('');
    const start = addDays(month, -((month.getDay() - ws + 7) % 7));
    let h = '';
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i), k = ymd(d);
      const cls = ['cal-d'];
      if (d.getMonth() !== month.getMonth()) cls.push('out');
      if (k === ymd(now)) cls.push('today');
      h += `<button class="${cls.join(' ')}" data-d="${k}" title="${esc(dailyPath(d))}" aria-label="${DOWS[d.getDay()]} ${d.getDate()} ${MONS[d.getMonth()]} ${d.getFullYear()}">${d.getDate()}<i></i></button>`;
    }
    $('#cal-grid').innerHTML = h;
    loadDots(start);
  }
  async function loadDots(start) {
    if (!Vault.ready()) return;
    const key = ymd(start) + '|' + dailyPath(start);
    let set = dotCache.get(key);
    if (!set) {
      set = new Set(); const byDir = new Map();
      for (let i = 0; i < 42; i++) {
        const d = addDays(start, i), p = dailyPath(d), slash = p.lastIndexOf('/');
        const dir = slash < 0 ? '' : p.slice(0, slash);
        if (!byDir.has(dir)) byDir.set(dir, []);
        byDir.get(dir).push([ymd(d), p.slice(slash + 1)]);
      }
      for (const [dir, list] of byDir) {
        const names = await Vault.names(dir);
        for (const [k, n] of list) if (names.has(n)) set.add(k);
      }
      dotCache.set(key, set);
    }
    $$('#cal-grid .cal-d').forEach(b => b.classList.toggle('has', set.has(b.dataset.d)));
  }
  function applyFold() {
    const folded = !S.calOpen, b = $('#ck-fold');
    $('#w-clock').classList.toggle('folded', folded);
    b.setAttribute('aria-expanded', String(!folded));
    b.title = folded ? 'Show calendar' : 'Hide calendar';
    b.setAttribute('aria-label', b.title);
  }
  $('#ck-fold').onclick = () => {
    S.calOpen = !S.calOpen; saveSettings(); applyFold();
    if (!S.calOpen) { const n = new Date(); month = new Date(n.getFullYear(), n.getMonth(), 1); render(); }
    placeWin('clock');
  };
  applyFold();
  $('#cal-prev').onclick = () => { month = new Date(month.getFullYear(), month.getMonth() - 1, 1); render(); };
  $('#cal-next').onclick = () => { month = new Date(month.getFullYear(), month.getMonth() + 1, 1); render(); };
  $('#cal-today').onclick = () => { const n = new Date(); month = new Date(n.getFullYear(), n.getMonth(), 1); render(); };
  $('#cal-grid').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) Notes.openDaily(parseYmd(b.dataset.d)); });
  $('#w-clock').addEventListener('wheel', e => {
    if (!e.target.closest('.ck-cal')) return;
    e.preventDefault();
    month = new Date(month.getFullYear(), month.getMonth() + (e.deltaY > 0 ? 1 : -1), 1); render();
  }, { passive: false });
  return {
    tick(now) {
      renderFace(now);
      const k = ymd(now);
      if (k !== today) { const td = parseYmd(today), wasCur = month.getMonth() === td.getMonth() && month.getFullYear() === td.getFullYear(); today = k; if (wasCur) month = new Date(now.getFullYear(), now.getMonth(), 1); render(); }
    },
    render() { lastMin = -1; render(); renderFace(new Date()); },
    invalidate() { dotCache.clear(); render(); }
  };
})();

/* =====================================================================
   Settings
   ===================================================================== */

  const name = Vault.handle ? Vault.handle.name : '';
  box.innerHTML = `${ico('gem')}<div><strong>${Vault.ready() ? esc(name) : Vault.handle ? esc(name) + ' (needs permission)' : 'No vault folder connected'}</strong>${
    Vault.ready() ? 'Dotdesk reads and writes notes in this folder.' :
    Vault.handle ? 'Your browser asks again after a restart. Reconnect to keep writing.' :
    Vault.supported ? 'Connect it to write notes directly. Until then, notes go through obsidian:// links.' :
    "This browser can't open folders. Notes go through obsidian:// links instead."}</div>${
    Vault.ready() ? `<button class="btn" id="v-disc">Disconnect</button>` :
    Vault.handle ? `<button class="btn primary" id="v-re">Reconnect</button>` :
    `<button class="btn primary" id="v-con"${Vault.supported ? '' : ' disabled'}>Connect folder</button>`}`;
  const c = $('#v-con', box), r = $('#v-re', box), d = $('#v-disc', box);
  if (c) c.onclick = async () => { if (await Vault.connect()) fillSettings(); };
  if (r) r.onclick = () => Vault.usable();
  if (d) d.onclick = () => Vault.disconnect();
}
let fillSettings = () => { };

      <button class="btn" id="s-imp">${ico('upload')}Import backup</button>
      <button class="btn" id="s-lay">${ico('columns')}Reset widget layout</button>
    </div>
  </div>`;
  const ids = { 's-vault': 'vaultName', 's-dfolder': 'dailyFolder', 's-dformat': 'dailyFormat', 's-nfolder': 'notesFolder' };
  fillSettings = () => {
    for (const id in ids) { const el = $('#' + id, f); if (el && document.activeElement !== el) el.value = S[ids[id]]; }
    $('#s-head', f).checked = S.appendHeading; $('#s-h24', f).checked = S.h24; $('#s-sec', f).checked = S.seconds;
    $('#s-ws', f).value = String(S.calWeekStart);
    $('#s-dprev', f).innerHTML = `Today's note: <code>${esc(dailyPath(new Date()))}</code>. Tokens: YYYY, MM, DD, ddd, MMM, [literal text].`;
  };
  f.addEventListener('input', e => {
    const k = ids[e.target.id];
    if (k) S[k] = e.target.value;

    const data = store.all();

  };

}
$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const json = JSON.parse(await file.text());
    if (json.app !== 'dotdesk' || !json.data) throw new Error('not a Dotdesk backup');
    if (!await confirmBox('Replace everything with this backup?', `The backup from ${String(json.exported || '').slice(0, 10)} replaces your current desks, notes, tasks, day plans and settings.`, 'Replace', true)) return;
    for (const k of Object.keys(store.all())) store.del(k);
    for (const [k, v] of Object.entries(json.data)) if (v != null) store.set(k, v);
    flushers.length = 0;
    location.reload();
  } catch (err) { toast(`That file couldn't be imported: ${err.message}.`, { kind: 'warn' }); }
});
$('#rb-settings').onclick = openSettings;
$('#rb-vault').onclick = async () => { if (Vault.ready()) openSettings(); else if (Vault.handle) await Vault.usable(); else await Vault.connect(); };
$('#rb-daily').onclick = () => Notes.openDaily(new Date());

/* =====================================================================
   Example content (first run only, clearly marked)
   ===================================================================== */
function curve(x0, y0, cx, cy, x1, y1, n = 26, wob = 1.2) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push(r1(u * u * x0 + 2 * u * t * cx + t * t * x1 + Math.sin(i * 1.7) * wob), r1(u * u * y0 + 2 * u * t * cy + t * t * y1 + Math.cos(i * 1.3) * wob));
  }
  return pts;
}
function seedExamples() {
  const ex = { sample: true };
  B.items.push(
    Object.assign({ id: uid(), type: 'card', x: -500, y: -205, w: 290, h: 232, color: 1, title: 'How the board works', text: '- **V** select · **P** pen · **H** highlighter\n- **E** eraser · **T** text · **N** post-it · **C** card\n- Drag empty space to pan, **Ctrl + scroll** to zoom\n- Click a post-it to write on it' }, ex),
    Object.assign({ id: uid(), type: 'postit', x: -150, y: -222, w: 210, h: 178, color: 3, rot: -2.2, text: 'Re-run the VaN3Twin scenario with the new CPM rule set' }, ex),
    Object.assign({ id: uid(), type: 'postit', x: 112, y: -190, w: 196, h: 166, color: 1, rot: 1.7, text: 'MARLUP: go through the missing parts list' }, ex),
    Object.assign({ id: uid(), type: 'text', x: -96, y: 52, fs: 36, color: 0, font: 'hand', text: 'Week 41: write up the CPM results' }, ex)
  );
  const s1 = { id: uid(), hl: true, color: PAL[3].ink, w: 16, pts: curve(-92, 104, 110, 98, 330, 101, 24, 0.8) };
  const s2 = { id: uid(), hl: false, color: PAL[1].ink, w: 3.5, pts: curve(-182, 82, -170, 20, -110, -24, 22, 0.6) };
  const s3 = { id: uid(), hl: false, color: PAL[1].ink, w: 3.5, pts: [-126, -22.2, -110, -24, -116.6, -9.2] };
  [s1, s2, s3].forEach(s => { Object.assign(s, ex); bbox(s); B.strokes.push(s); });
  return {
    note: {
      id: uid(), title: 'Quick capture', sample: true,
      content: `# Quick capture\n\nJot things down here, then send them to Obsidian:\n- **Append to today** adds this text to \`${dailyPath(new Date())}\`\n- **Save as note** creates \`${S.notesFolder}/Quick capture.md\`\n\n## Today\n- [x] Check last night's VaN3Twin run\n- [ ] Compare CAM generation rates for both rule sets\n- [ ] Update the [[MARLUP]] parts list\n\n> [!tip] Connect your vault\n> Click the gem on the left and pick your vault folder. Dotdesk then writes straight into it and dots the calendar days that have notes.\n\n==Highlights==, #tags and \`inline code\` render the way Obsidian shows them.`
    },
    tasks: {
      daily: [{ id: uid(), text: "Review yesterday's daily note", done: true, sample: true }, { id: uid(), text: 'Two focus blocks on thesis writing', done: false, sample: true }, { id: uid(), text: 'Clear the Obsidian inbox', done: false, sample: true }],
      weekly: [{ id: uid(), text: 'Back up simulation results', done: false, sample: true }, { id: uid(), text: "Plan next week's simulation runs", done: false, sample: true }, { id: uid(), text: 'Tidy the Bachelor Thesis folder', done: true, sample: true }],
      biweekly: [{ id: uid(), text: 'Progress meeting with advisor', done: false, sample: true }, { id: uid(), text: 'Review MARLUP control parameters', done: false, sample: true }]
    },
    plan: [
      { s: 16, e: 17, title: 'Breakfast and inbox', color: '#8c9096' },
      { s: 18, e: 23, title: 'Thesis: write up CPM results', color: null },
      { s: 24, e: 26, title: 'Lunch', color: '#8c9096' },
      { s: 27, e: 30, title: 'MARLUP parts list', color: '#f0a033' },
      { s: 36, e: 39, title: 'Gym', color: '#4fc76a' }
    ].map(b => Object.assign({ id: uid(), sample: true }, b))
  };
}
const F = Object.assign({ examples: false }, store.get('flags', {}));
const saveFlags = () => store.set('flags', F);
function examplesUI() { $('#examples').hidden = !F.examples; }
$('#ex-clear').onclick = () => {
  for (const d of DK.list) {
    const b = loadBoard(d.id), n = b.items.length + b.strokes.length;
    b.items = b.items.filter(i => !i.sample); b.strokes = b.strokes.filter(s => !s.sample);
    if (b.items.length + b.strokes.length !== n) { store.set(bKey(d.id), b); hist.delete(d.id); }
  }
  undoS.length = 0; redoS.length = 0;
  renderAllItems(); afterHistory();
  Tasks.clearSamples(); Notes.clearSamples(); Plan.clearSamples();
  F.examples = false; saveFlags(); examplesUI();
  toast('Example content cleared. The board is yours.');
};
$('#ex-keep').onclick = () => { F.examples = false; saveFlags(); examplesUI(); };

/* =====================================================================
   Keyboard
   ===================================================================== */
const TOOL_KEYS = { v: 'select', p: 'pen', h: 'hl', e: 'eraser', t: 'text', n: 'postit', c: 'card' };
document.addEventListener('keydown', e => {
  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    const map = { Digit1: 'notes', Digit2: 'timer', Digit3: 'tasks', Digit4: 'plan', Digit5: 'clock' };
    if (map[e.code]) { e.preventDefault(); const id = map[e.code]; setWin(id, !L[id].open || L[id].min); return; }
    if (e.code === 'KeyP') { e.preventDefault(); Pomo.toggle(); return; }
    if ((e.code === 'ArrowUp' || e.code === 'ArrowDown') && DK.list.length > 1) {
      e.preventDefault();
      const i = DK.list.findIndex(d => d.id === deskId), n = DK.list.length;
      closeMenu(); switchDesk(DK.list[(i + (e.code === 'ArrowDown' ? 1 : n - 1)) % n].id);
      return;
    }
  }
  if (e.key === 'Escape') { closeMenu(); if (!isTyping()) { if (selId) selectItem(null); else if (tool !== 'select') setTool('select'); } return; }
  if (isTyping() || document.querySelector('.modal-back')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
  if (mod && (e.key === '0')) { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 1 / view.z); return; }
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 1.2); return; }
  if (mod && e.key === '-') { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2); return; }
  if (mod || e.altKey) return;
  if (e.code === 'Space') {
    const a = document.activeElement;
    if (a && a !== document.body && !boardEl.contains(a)) return;
    e.preventDefault(); if (!spaceDown) { spaceDown = true; boardEl.classList.add('space'); } return;
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selId) { e.preventDefault(); deleteItem(selId); return; }
  const k = e.key.toLowerCase();
  if (TOOL_KEYS[k]) { setTool(TOOL_KEYS[k]); return; }
  if (/^[1-7]$/.test(e.key)) { S.color = +e.key - 1; saveSettings(); colorsUI(); }
  if (e.key === '[' || e.key === ']') { S.size = clamp(S.size + (e.key === ']' ? 1 : -1), 0, 2); saveSettings(); sizesUI(); requestFrame(); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; boardEl.classList.remove('space'); } });
window.addEventListener('blur', () => { spaceDown = false; boardEl.classList.remove('space'); });

/* =====================================================================
   Boot
   ===================================================================== */
let seeded = null;
if (firstRun) { seeded = seedExamples(); F.examples = true; saveFlags(); saveBoard(); saveDesks(); Plan.seed(seeded.plan); }
colorsUI(); setTool(tool);
renderAllItems(); undoUI();
Notes.init(seeded && seeded.note);
Tasks.init(seeded && seeded.tasks);
applyDesk();
WIN_IDS.forEach(placeWin);
focusWin($('#w-notes'));
resizeInk();
if (firstRun || !store.get(vKey(deskId), null)) fitBoard(0.7); else applyView(false);
Cal.render();
examplesUI();
Vault.init();

let lastSecond = -1;
setInterval(() => {
  const now = new Date();
  Pomo.tick();
  if (now.getSeconds() !== lastSecond) {
    lastSecond = now.getSeconds();
    Cal.tick(now);
    Plan.tick(now);
    if (lastSecond === 0) Tasks.tick();
  }
}, 250);
let lastHour = new Date().getHours();
setInterval(() => { const h = new Date().getHours(); if (h !== lastHour) { lastHour = h; Tasks.render(); } }, 60000);

const onResize = debounce(() => { WIN_IDS.forEach(placeWin); resizeInk(); }, 80);
window.addEventListener('resize', onResize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { WIN_IDS.forEach(placeWin); Cal.render(); });
const flushAll = () => flushers.forEach(x => x.flush());
window.addEventListener('pagehide', flushAll);
window.addEventListener('beforeunload', flushAll);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
})();
</script>
