<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dotdesk</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230a0b0c%22/%3E%3Ccircle%20cx%3D%227%22%20cy%3D%227%22%20r%3D%223.3%22%20fill%3D%22%231a9bd0%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%227%22%20r%3D%223.3%22%20fill%3D%22%237d8187%22/%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%227%22%20r%3D%223.3%22%20fill%3D%22%237d8187%22/%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2216%22%20r%3D%223.3%22%20fill%3D%22%237d8187%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%223.3%22%20fill%3D%22%231a9bd0%22/%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2216%22%20r%3D%223.3%22%20fill%3D%22%237d8187%22/%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2225%22%20r%3D%223.3%22%20fill%3D%22%237d8187%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2225%22%20r%3D%223.3%22%20fill%3D%22%237d8187%22/%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2225%22%20r%3D%223.3%22%20fill%3D%22%231a9bd0%22/%3E%3C/svg%3E">
<style>
/* Layout: full-bleed dot-matrix pin board; Obsidian-style ribbon on the left; tool palette top-centre;
   floating panes (notepad, pomodoro, tasks) above the board; clock + calendar docked bottom-right. */
:root{
  color-scheme:dark;
  --bg:#000;
  --pane:#0a0b0c;
  --pane-2:#101214;
  --line:#1c1f22;
  --line-2:#2a2e33;
  --hover:#15181b;
  --text:#dcddde;
  --muted:#8c9096;
  --faint:#5a5e64;
  --accent:#1a9bd0;
  --on-accent:#00131b;
  --accent-hi:color-mix(in srgb,var(--accent) 78%,#fff);
  --accent-deep:color-mix(in srgb,var(--accent) 34%,#000);
  --accent-wash:color-mix(in srgb,var(--accent) 13%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 55%,transparent);
  --accent-glow:color-mix(in srgb,var(--accent) 38%,transparent);
  --orange:#f0a033;
  --yellow:#e6c24b;
  --green:#4fc76a;
  --red:#ef5d6c;
  --purple:#a88bfa;
  --dot:#26292d;
  --paper-ink:#1d1c19;
  --shadow:rgba(0,0,0,.92);
  --font-ui:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --font-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:400 13.5px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- board ---------- */
#board{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--bg);--g:24px;--gx:0px;--gy:0px}
#dots,#glow{position:absolute;inset:0;pointer-events:none;background-size:var(--g) var(--g);background-position:var(--gx) var(--gy)}
#dots{background-image:radial-gradient(circle,var(--dot) 1.15px,transparent 1.65px)}
#glow{background-image:radial-gradient(circle,var(--accent) 1.35px,transparent 1.85px);opacity:0;transition:opacity .3s;
  -webkit-mask-image:radial-gradient(170px circle at var(--mx,-500px) var(--my,-500px),#000 0%,rgba(0,0,0,.3) 45%,transparent 100%);
  mask-image:radial-gradient(170px circle at var(--mx,-500px) var(--my,-500px),#000 0%,rgba(0,0,0,.3) 45%,transparent 100%)}
#board.glow #glow{opacity:.5}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#ink{position:absolute;inset:0;pointer-events:none}
#board:not([data-tool="select"]) #ink{pointer-events:auto}
#board[data-tool="pen"],#board[data-tool="hl"]{cursor:crosshair}
#board[data-tool="eraser"]{cursor:none}
#board[data-tool="text"]{cursor:text}
#board[data-tool="postit"],#board[data-tool="card"]{cursor:copy}
#board.space,#board.space #ink{cursor:grab}
#board.panning,#board.panning #ink{cursor:grabbing}

/* board items */
.it{position:absolute;user-select:none}
.it.dragging{cursor:grabbing}
.it-ed{pointer-events:none}
.it.editing .it-ed{pointer-events:auto;-webkit-user-select:text;user-select:text}
.it-bar{position:absolute;bottom:100%;right:-4px;padding-bottom:8px;opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .15s;z-index:2}
.it-bar-in{display:flex;gap:2px;padding:3px;background:var(--pane-2);border:1px solid var(--line-2);border-radius:9px;box-shadow:0 8px 20px -6px var(--shadow)}
.it-bar button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted);font:600 11px var(--font-ui)}
.it-bar button:hover{background:var(--hover);color:var(--text)}
.it-bar .sw{width:12px;height:12px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1.5px rgba(255,255,255,.18)}
.it-bar .i{width:15px;height:15px}
#board[data-tool="select"] .it:hover .it-bar,#board[data-tool="select"] .it.sel .it-bar{opacity:1;pointer-events:auto;transform:none}
.it.sel{outline:1.5px solid var(--accent);outline-offset:5px}
.it-rs{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;cursor:nwse-resize;opacity:0;touch-action:none}
.it-rs::after{content:"";position:absolute;inset:4px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);border-radius:0 0 3px 0}
#board[data-tool="select"] .it:hover .it-rs,#board[data-tool="select"] .it.sel .it-rs{opacity:1}

.postit{background:var(--paper);color:var(--paper-ink);border-radius:2px 2px 5px 5px;padding:30px 16px 14px;transform:rotate(var(--rot,0deg));
  background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 75%,rgba(0,0,0,.08));
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 18px 26px -14px var(--shadow),0 3px 6px rgba(0,0,0,.55)}
.postit::before{content:"";position:absolute;top:9px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 14%,var(--pin) 46%,#04131a 100%);box-shadow:0 3px 3px rgba(0,0,0,.45)}
.postit-text{display:block;width:100%;height:100%;resize:none;border:0;background:transparent;color:inherit;outline:none;padding:0;font:600 27px/1.08 var(--font-hand);overflow:hidden}
.postit-text::placeholder{color:rgba(0,0,0,.35)}

.card{display:flex;flex-direction:column;background:#0d0e10;border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 34px -16px var(--shadow)}
.card::before{content:"";height:3px;border-radius:9px 9px 0 0;background:var(--strip);flex:none}
.card-title{flex:none;width:100%;background:transparent;border:0;outline:none;padding:10px 14px 2px;font:600 15px/1.35 var(--font-ui);color:var(--text)}
.card-title::placeholder{color:var(--faint)}
.card-body{flex:1;min-height:0;overflow:hidden;padding:4px 14px 12px;font-size:13px}
.card-src{flex:1;min-height:0;width:100%;resize:none;background:transparent;border:0;outline:none;padding:4px 14px 12px;font:12.5px/1.6 var(--font-mono);color:var(--text)}
.card.editing .card-body{display:none}
.card:not(.editing) .card-src{display:none}

.txt{color:var(--ink);font:600 var(--fs,28px)/1.12 var(--font-hand);padding:2px 4px;min-width:24px}
.txt.sans{font-family:var(--font-ui);font-weight:500;letter-spacing:-.01em}
.txt-body{outline:none;white-space:pre;min-height:1.12em}
.txt-body:empty::before{content:"Type here";opacity:.35}

/* ---------- ribbon ---------- */
#ribbon{position:fixed;left:0;top:0;bottom:0;width:48px;z-index:5000;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:#050606;border-right:1px solid var(--line)}
.rb-mark{display:grid;grid-template-columns:repeat(3,4px);gap:4px;padding:6px;margin-bottom:10px}
.rb-mark i{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.rb-mark i:nth-child(1),.rb-mark i:nth-child(5),.rb-mark i:nth-child(9){background:var(--accent)}
.rb{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted);border:1px solid transparent}
.rb:hover{color:var(--text);background:var(--hover)}
.rb.on{color:var(--accent);background:var(--accent-wash);border-color:var(--accent-line)}
.rb-sep{width:20px;height:1px;background:var(--line-2);margin:6px 0}
.rb-fill{flex:1}
#rb-desks{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:36px;flex:0 1 auto;overflow-y:auto;scrollbar-width:none;padding:1px 0}
#rb-desks::-webkit-scrollbar{display:none}
.rb-desk{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;font:600 13px/1 var(--font-ui);color:var(--dc);
  background:color-mix(in srgb,var(--dc) 8%,transparent);border:1px solid color-mix(in srgb,var(--dc) 22%,transparent);transition:background .15s,border-color .15s,box-shadow .15s}
.rb-desk:hover{background:color-mix(in srgb,var(--dc) 17%,transparent)}
.rb-desk.on{background:color-mix(in srgb,var(--dc) 20%,transparent);border-color:var(--dc);box-shadow:0 0 14px -5px var(--dc)}
.rb-desk.on::before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--dc)}
.rb-add{border:1px dashed var(--line-2)}
.rb-add:hover{border-color:var(--accent-line);color:var(--accent);background:transparent}
.rb-led{position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 2px #050606}
.rb-led.ok{background:var(--green)}
.rb-led.wait{background:var(--orange)}

/* ---------- toolbar ---------- */
#toolbar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(50% + 24px);transform:translateX(-50%);z-index:5000;display:flex;align-items:center;gap:6px;padding:5px 6px;
  background:var(--pane);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 14px 36px -14px var(--shadow);max-width:calc(100vw - 72px);overflow-x:auto}
.tb-grp{display:flex;align-items:center;gap:2px;flex:none}
.tb{height:32px;min-width:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);border:1px solid transparent}
.tb:hover{background:var(--hover);color:var(--text)}
.tb.on{color:var(--accent);background:var(--accent-wash);border-color:var(--accent-line)}
.tb-sep{width:1px;height:20px;background:var(--line-2);flex:none}
.tb-desk{height:32px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-radius:8px;flex:none;max-width:190px;color:var(--text);font:500 12.5px var(--font-ui);white-space:nowrap}
.tb-desk:hover{background:var(--hover)}
.tb-desk-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.tb-desk-name{overflow:hidden;text-overflow:ellipsis}
.tb-desk .i{width:14px;height:14px;color:var(--faint)}
#board-hint{position:fixed;z-index:1;transform:translate(-50%,-50%);width:max-content;max-width:min(400px,70vw);text-align:center;pointer-events:none;color:var(--faint);font-size:13px;line-height:1.75}
#board-hint b{display:block;margin-bottom:2px;font:600 11px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
#board-hint kbd{font:500 11px var(--font-mono);padding:1px 6px;border:1px solid var(--line-2);border-radius:5px;color:var(--muted);background:var(--pane)}
.tb-zoom{font:500 11.5px var(--font-mono);padding:0 6px;font-variant-numeric:tabular-nums}
.tb-sw{width:26px;height:32px;display:grid;place-items:center;border-radius:8px}
.tb-sw span{width:14px;height:14px;border-radius:50%;background:var(--sw);transition:transform .12s;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.tb-sw:hover span{transform:scale(1.15)}
.tb-sw.on span{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--sw)}
.tb-sz{width:28px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.tb-sz span{border-radius:50%;background:currentColor}
.tb-sz:hover{background:var(--hover);color:var(--text)}
.tb-sz.on{color:var(--accent)}
#examples{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:calc(50% + 24px);transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;
  background:var(--pane-2);border:1px dashed var(--line-2);border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:calc(100vw - 72px)}
@media (max-width:560px){#examples span{display:none}}
#examples button{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:var(--text)}
#examples button:hover{background:var(--hover)}
#examples #ex-clear{color:var(--accent)}

/* ---------- windows ---------- */
.win{position:fixed;z-index:30;display:flex;flex-direction:column;background:var(--pane);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 28px 60px -24px var(--shadow),0 0 0 1px rgba(0,0,0,.7);max-width:calc(100vw - 56px)}
.win.active{border-color:var(--line-2)}
.win.moving{opacity:.94}
.win-bar{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;border-radius:12px 12px 0 0}
.win.moving .win-bar{cursor:grabbing}
.win-bar>.i{width:16px;height:16px;color:var(--faint)}
.win.active .win-bar>.i{color:var(--accent)}
.win-bar h2{margin:0;font:500 13px var(--font-ui);color:var(--muted);white-space:nowrap}
.win.active .win-bar h2{color:var(--text)}
.win-meta{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.win-act{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.win.min{height:auto!important}
.win.min .win-bar{border-bottom-color:transparent;border-radius:12px}
.win.min .win-body,.win.min .win-rs{display:none}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column}
.win-rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:2}
.win-rs::after{content:"";position:absolute;right:5px;bottom:5px;width:6px;height:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint)}
.ib{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib .i{width:16px;height:16px}
.ib.sm{width:24px;height:24px}
.ib.sm .i{width:14px;height:14px}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#060707}
.seg button{height:24px;min-width:28px;padding:0 6px;display:grid;place-items:center;border-radius:6px;color:var(--faint);font-size:12px;font-weight:500}
.seg button .i{width:15px;height:15px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent-wash);color:var(--accent)}
.btn{height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;border-radius:8px;border:1px solid var(--line-2);color:var(--text);font-size:12.5px;font-weight:500;white-space:nowrap;flex:none}
.btn .i{width:15px;height:15px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.danger{border-color:rgba(239,93,108,.5);color:var(--red)}
.btn.danger:hover{background:rgba(239,93,108,.12)}

/* ---------- notepad ---------- */
.np-tabs{flex:none;display:flex;align-items:flex-end;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
#np-tablist{display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
.np-tab{display:flex;align-items:center;gap:4px;max-width:190px;height:30px;padding:0 4px 0 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;color:var(--faint);font-size:12.5px;cursor:pointer;flex:none;position:relative}
.np-tab:hover{color:var(--text);background:var(--hover)}
.np-tab.on{color:var(--accent);background:var(--bg);border-color:var(--accent-line);margin-bottom:-1px;height:31px}
.np-tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-tab input{width:120px;background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:1px 4px;font-size:12px;outline:none}
.np-tab.dirty .np-tt::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:6px;vertical-align:middle}
.np-tx{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:.6}
.np-tx:hover{opacity:1;background:var(--hover)}
.np-tx .i{width:13px;height:13px}
.np-add{margin-bottom:3px}
.np-crumb{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px 6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;background:var(--bg)}
.np-crumb .sep{color:var(--faint)}
.np-crumb b{font-weight:500;color:var(--accent);overflow:hidden;text-overflow:ellipsis}
.np-crumb .kind{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--faint);margin-right:4px}
.np-crumb .kind.linked{border-color:rgba(79,199,106,.45);color:var(--green)}
.np-panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--bg)}
.np-panes[data-mode="edit"],.np-panes[data-mode="read"]{grid-template-columns:minmax(0,1fr)}
.np-panes[data-mode="edit"] #np-prev,.np-panes[data-mode="read"] #np-src{display:none}
#np-src{resize:none;border:0;outline:none;background:transparent;color:var(--text);font:400 12.75px/1.7 var(--font-mono);padding:14px 18px 24px;tab-size:4;min-height:0}
#np-src::placeholder{color:var(--faint)}
#np-prev{overflow:auto;padding:12px 22px 28px;min-width:0}
.np-panes[data-mode="split"] #np-prev{border-left:1px solid var(--line)}
.np-foot{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.np-info{flex:1;min-width:110px;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* rendered markdown */
.md{color:var(--text);font-size:13.5px;line-height:1.65;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{font-family:var(--font-ui);line-height:1.25;margin:1.1em 0 .45em;text-wrap:balance}
.md h1{font-size:1.85em;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.md h2{font-size:1.3em;font-weight:600}
.md h3{font-size:1.08em;font-weight:600;color:var(--accent-hi)}
.md h4{font-size:1em;font-weight:600;color:var(--muted)}
.md p{margin:.55em 0}
.md ul,.md ol{margin:.4em 0;padding-left:1.4em}
.md li{margin:.15em 0}
.md li::marker{color:var(--faint)}
.md li.task{list-style:none;margin-left:-1.3em;display:flex;flex-wrap:wrap;gap:.55em;align-items:baseline}
.md li.task>input{appearance:none;width:14px;height:14px;border:1.5px solid var(--faint);border-radius:4px;flex:none;position:relative;top:2px;cursor:pointer;margin:0}
.md li.task>input:checked{background:var(--accent);border-color:var(--accent)}
.md li.task>input:checked::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.md li.task>span{flex:1;min-width:0}
.md li.task.done>span{color:var(--faint);text-decoration:line-through}
.md li.task ul{width:100%}
.md a{color:var(--accent);text-decoration:none}
.md a:hover{text-decoration:underline}
.md a.wl{color:var(--purple)}
.md mark{background:rgba(230,194,75,.28);color:inherit;border-radius:3px;padding:0 2px}
.md code{font:.88em var(--font-mono);background:#14171a;border:1px solid var(--line);border-radius:4px;padding:.05em .35em;color:#e9a0b0}
.md pre{background:#0d0f11;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto}
.md pre code{background:none;border:0;padding:0;color:var(--text);font-size:12px}
.md blockquote{margin:.6em 0;padding:.1em 0 .1em 1em;border-left:2px solid var(--accent);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line-2);margin:1.2em 0}
.md .tag{display:inline-block;font-size:.85em;padding:0 .5em;border-radius:999px;background:var(--accent-wash);color:var(--accent)}
.md .callout{margin:.7em 0;padding:.6em .9em;border-radius:8px;background:var(--accent-wash);border-left:3px solid var(--accent)}
.md .callout[data-type="warning"],.md .callout[data-type="caution"]{background:rgba(240,160,51,.1);border-color:var(--orange)}
.md .callout[data-type="success"],.md .callout[data-type="done"]{background:rgba(79,199,106,.1);border-color:var(--green)}
.md .callout-title{font-weight:600;color:var(--accent)}
.md .callout[data-type="warning"] .callout-title{color:var(--orange)}
.md .callout>p:last-child{margin-bottom:0}
.md .props{font:12px/1.6 var(--font-mono);color:var(--faint);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:1em;white-space:pre-wrap}
.md .tbl{overflow-x:auto}
.md table{border-collapse:collapse;font-size:.92em;margin:.6em 0}
.md th,.md td{border:1px solid var(--line-2);padding:4px 10px;text-align:left}
.md th{background:var(--pane-2);font-weight:600}
.md .ph{color:var(--faint)}

/* ---------- pomodoro ---------- */
#w-timer{width:300px}
.pm{--pm:var(--accent)}
.pm[data-mode="short"]{--pm:var(--green)}
.pm[data-mode="long"]{--pm:var(--purple)}
.pm-main{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px 14px}
.pm-modes{align-self:stretch;justify-content:stretch}
.pm-modes button{flex:1}
.pm[data-mode="short"] .pm-modes button.on{background:rgba(79,199,106,.13);color:var(--green)}
.pm[data-mode="long"] .pm-modes button.on{background:rgba(168,139,250,.14);color:var(--purple)}
.pm-ring{position:relative;width:200px;max-width:100%;aspect-ratio:1}
.pm-ring svg{width:100%;height:100%;display:block}
.pm-trk{fill:none;stroke:var(--line);stroke-width:5}
.pm-prog{fill:none;stroke:var(--pm);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:110px 110px;transition:stroke-dashoffset .3s linear,stroke .3s}
.pm-tk{stroke:var(--line-2);stroke-width:1.2}
.pm-tk.mj{stroke:var(--faint);stroke-width:1.6}
.pm-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pm-time{font:300 46px/1 var(--font-ui);letter-spacing:-.01em}
.dg{display:inline-block;width:.6em;text-align:center}
.pm-label{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.pm-ctrl{display:flex;align-items:center;gap:18px}
.ib.lg{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2)}
.ib.lg .i{width:17px;height:17px}
.pm-go{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--pm);color:var(--on-accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--pm) 14%,transparent);transition:transform .12s,box-shadow .2s}
.pm-go:hover{transform:scale(1.04)}
.pm-go .i{width:22px;height:22px}
.pm-foot{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.pm-dots{display:flex;gap:5px}
.pm-dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--faint)}
.pm-dots i.on{background:var(--accent);border-color:var(--accent)}
.pm-dots i.cur{border-color:var(--pm)}
.win.ding{animation:ding 1.2s ease-out 3}
@keyframes ding{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent),0 28px 60px -24px var(--shadow)}100%{box-shadow:0 0 0 18px transparent,0 28px 60px -24px var(--shadow)}}
.pm-form{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.pm-form h3{margin:0 0 2px;font:600 11px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.fld-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.fld-row label{color:var(--muted)}
.num{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12px}
.num input{width:64px;height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);text-align:right;font-variant-numeric:tabular-nums;outline:none}
.num input:focus,select:focus,.txt-in:focus{border-color:var(--accent)}
select,.txt-in{height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);outline:none;min-width:0}
input[type="range"]{accent-color:var(--accent);width:130px}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{appearance:none;width:15px;height:15px;margin:2px 0 0;border:1.5px solid var(--faint);border-radius:4px;flex:none;position:relative;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.pm-form-act{display:flex;justify-content:space-between;gap:8px;margin-top:6px}

/* ---------- tasks ---------- */
.tk-wrap{container-type:inline-size}
.tk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.tcol{--c:var(--accent);display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px 12px 8px;border-right:1px solid var(--line)}
.tcol:last-child{border-right:0}
.tcol-head{display:flex;align-items:center;gap:8px}
.tcol-head h3{margin:0;font:600 11.5px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.tcount{margin-left:auto;font:500 11px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tcol-head .ib{width:22px;height:22px;opacity:0}
.tcol:hover .tcol-head .ib,.tcol-head .ib:focus-visible{opacity:1}
.tcol-sub{font-size:11px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{height:2px;border-radius:2px;background:var(--line);margin:9px 0 6px;overflow:hidden;flex:none}
.tbar i{display:block;height:100%;background:var(--c);transition:width .35s}
.tlist{list-style:none;margin:0;padding:2px 0;overflow-y:auto;flex:1;min-height:30px}
.tlist.drop-end{box-shadow:inset 0 -2px 0 var(--c)}
.tki{display:flex;align-items:flex-start;gap:9px;padding:5px 4px 5px 4px;border-radius:7px;position:relative;font-size:13px;line-height:1.45}
.tki:hover{background:var(--hover)}
.tki.dragging{opacity:.35}
.tki.drop-before{box-shadow:inset 0 2px 0 var(--c)}
.tcheck{width:16px;height:16px;margin-top:1.5px;border-radius:4.5px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.tcheck:hover{border-color:var(--c)}
.tcheck .i{width:11px;height:11px;stroke-width:3.2;color:var(--on-accent);opacity:0}
.tki.done .tcheck{background:var(--c);border-color:var(--c)}
.tki.done .tcheck .i{opacity:1}
.ttext{flex:1;min-width:0;overflow-wrap:anywhere;cursor:grab;outline:none}
.ttext[contenteditable="true"]{cursor:text;background:var(--bg);box-shadow:0 0 0 1px var(--line-2);border-radius:4px;padding:0 4px}
.tki.done .ttext{color:var(--faint);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent)}
.tdel{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--faint);opacity:0;flex:none}
.tdel .i{width:13px;height:13px}
.tki:hover .tdel{opacity:1}
.tdel:hover{color:var(--red);background:rgba(239,93,108,.1)}
.tadd{flex:none;display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line-2);margin-top:4px;padding-top:4px}
.tadd .i{width:15px;height:15px;color:var(--faint);margin-left:4px}
.tadd input{flex:1;min-width:0;height:30px;background:transparent;border:0;outline:none;font-size:13px}
.tadd input::placeholder{color:var(--faint)}
.tadd:focus-within .i{color:var(--c)}
@container (max-width:540px){
  .tk{grid-template-columns:minmax(0,1fr);overflow-y:auto}
  .tcol{border-right:0;border-bottom:1px solid var(--line)}
  .tlist{overflow:visible}
}

/* ---------- clock + calendar ---------- */
.win-bare{border:0;padding:1.5px;border-radius:15px;background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 45%,#000) 32%,color-mix(in srgb,var(--accent) 26%,#000) 58%,color-mix(in srgb,var(--accent) 72%,#000) 82%,var(--accent) 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.8),0 30px 60px -24px var(--shadow),0 0 46px -14px var(--accent-glow)}
.ck{display:flex;background:#000;border-radius:13.5px;overflow:hidden}
.ck-face{width:204px;flex:none;display:flex;flex-direction:column;padding:14px 12px 12px 18px;cursor:grab;touch-action:none;user-select:none;position:relative;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%)}
.win.moving .ck-face{cursor:grabbing}
.ck-day{font:600 9px var(--font-ui);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-day b{color:var(--accent);font-weight:600}
.ck-row{display:flex;align-items:center;gap:6px;margin:6px 0 1px}
.ck-time{display:flex;align-items:flex-start;font:300 46px/.95 var(--font-ui);letter-spacing:-.02em;color:#f2f3f4;font-variant-numeric:tabular-nums;white-space:nowrap}
.ck-colon{display:inline-block;transform:translateY(-.04em);margin:0 .01em;animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}
.ck-side{display:flex;flex-direction:column;gap:5px;margin:6px 0 0 5px}
.ck-ss{font:500 11.5px/1 var(--font-mono);color:var(--accent);letter-spacing:0}
.ck-ap{font:600 9px/1 var(--font-ui);color:var(--muted);letter-spacing:.1em}
.ck-fold{margin-left:auto;width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:7px;color:var(--muted);border:1px solid var(--line-2)}
.ck-fold:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-wash)}
.ck-fold .i{width:14px;height:14px;transition:transform .2s}
#w-clock.folded .ck-fold .i{transform:rotate(180deg)}
#w-clock.folded .ck-cal,#w-clock.folded .ck-nav{display:none}
.ck-month{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:4px}
#ck-mon{font:300 20px/1.15 var(--font-ui);color:#f2f3f4;white-space:nowrap;letter-spacing:.01em}
#ck-mon b{font-weight:800;letter-spacing:.02em}
.ck-nav{display:flex;align-items:center;gap:0;margin-left:-5px}
.ck-today{height:20px;padding:0 6px;border-radius:6px;font:600 8.5px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ck-today:hover{background:var(--hover);color:var(--text)}
.ck-today.off{color:var(--accent)}
.ck-pomo{margin-top:6px;align-self:flex-start;display:flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--accent-wash);color:var(--accent);font:500 10.5px var(--font-ui);cursor:pointer;font-variant-numeric:tabular-nums}
.ck-pomo i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 2s steps(1) infinite}
.ck-pomo.brk{background:rgba(79,199,106,.12);color:var(--green)}
.ck-track{margin-top:auto;padding-top:10px}
.ck-rail{position:relative;height:3px;border-radius:3px;background:#16191c}
.ck-rail i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 15%,transparent),var(--accent))}
.ck-rail b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#000;border:2px solid var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.ck-hrs{display:flex;justify-content:space-between;margin-top:5px;font:500 8px var(--font-mono);color:var(--faint)}
.ck-cal{width:276px;flex:none;border-left:1px solid #15181a;display:flex;flex-direction:column}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#0b0c0d;border-bottom:1px solid #121416;padding:7px 6px 5px;font:600 8.5px var(--font-ui);letter-spacing:.1em;color:var(--muted);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:28px;padding:3px 6px 6px}
.cal-d{position:relative;display:grid;place-items:center;border-radius:7px;font:400 11.5px var(--font-ui);color:#e4e5e6;font-variant-numeric:tabular-nums}
.cal-d:hover{background:#121518}
.cal-d.out{color:#3d4044}
.cal-d.today{color:var(--accent);font-weight:600}
.cal-d i{position:absolute;bottom:2px;left:50%;width:3.5px;height:3.5px;margin-left:-1.75px;border-radius:50%;background:transparent}
.cal-d.has i{background:#6d7176}
.cal-d.today i{background:var(--accent)}
@media (max-width:760px){
  .ck{flex-direction:column}
  .ck-face{width:auto}
  .ck-cal{width:auto;border-left:0;border-top:1px solid #15181a}
  .ck-fold .i{transform:rotate(90deg)}
  #w-clock.folded .ck-fold .i{transform:rotate(-90deg)}
}

/* ---------- day plan ---------- */
.pl-head{flex:none;display:flex;align-items:center;gap:2px;padding:7px 8px;border-bottom:1px solid var(--line)}
.pl-date{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-date b{color:var(--text);font-weight:600}
.pl-date.today b{color:var(--accent)}
.pl-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.pl-grid{display:grid;grid-template-columns:46px minmax(0,1fr);padding:10px 12px 14px 0}
.pl-hours{position:relative}
.pl-hours span{position:absolute;right:9px;transform:translateY(-50%);font:500 10px var(--font-mono);color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.pl-hours span.now{color:var(--accent)}
.pl-track{position:relative;cursor:crosshair;touch-action:pan-y}
#pl-lines,#pl-evs{position:absolute;inset:0}
#pl-lines{pointer-events:none}
.pl-line{position:absolute;left:0;right:0;border-top:1px solid #1a1d20}
.pl-line.half{border-top:1px dashed #121417}
.pl-past{position:absolute;left:0;right:0;top:0;pointer-events:none;background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.022) 6px 7px)}
.pl-now{position:absolute;left:0;right:0;z-index:3;border-top:1.5px solid var(--accent);pointer-events:none}
.pl-now::before{content:"";position:absolute;left:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.pl-ev{position:absolute;z-index:2;padding:3px 22px 3px 8px;border-radius:6px;overflow:hidden;cursor:grab;user-select:none;
  background:color-mix(in srgb,var(--ec) 15%,#0b0c0d);border:1px solid color-mix(in srgb,var(--ec) 30%,transparent);border-left:3px solid var(--ec);box-shadow:0 4px 12px -7px #000}
.pl-ev:hover{background:color-mix(in srgb,var(--ec) 23%,#0b0c0d)}
.pl-ev.dragging{cursor:grabbing;z-index:4;box-shadow:0 12px 24px -8px #000}
.pl-ev.editing{cursor:text}
.pl-ev-t{font:600 12px/1.35 var(--font-ui);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-ev.tall .pl-ev-t{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,2);overflow-wrap:anywhere}
.pl-ev-t input{width:100%;padding:0;border:0;outline:none;background:transparent;font:inherit;color:inherit}
.pl-ev-t input::placeholder{color:var(--faint)}
.pl-ev-time{font:500 10px/1.35 var(--font-mono);color:color-mix(in srgb,var(--ec) 65%,#fff);white-space:nowrap;font-variant-numeric:tabular-nums}
.pl-ev.short{display:flex;align-items:center;gap:7px;padding-top:0;padding-bottom:0}
.pl-ev.short .pl-ev-t{order:1;flex:1;min-width:0}
.pl-ev-x,.pl-ev-c{position:absolute;right:3px;width:17px;height:17px;border-radius:4px;display:grid;place-items:center;color:var(--muted);opacity:0}
.pl-ev-x{top:3px}
.pl-ev-c{top:22px}
.pl-ev-x,.pl-ev-c{background:inherit}
.pl-ev.short .pl-ev-c,.pl-ev.mid .pl-ev-c{top:3px;right:21px}
.pl-ev.short .pl-ev-x,.pl-ev.short .pl-ev-c{top:50%;margin-top:-8.5px}
.pl-ev:hover .pl-ev-x,.pl-ev:hover .pl-ev-c,.pl-ev-x:focus-visible,.pl-ev-c:focus-visible{opacity:1}
.pl-ev-x:hover{color:var(--red);background:rgba(239,93,108,.14)}
.pl-ev-x .i{width:11px;height:11px}
.pl-ev-c span{width:9px;height:9px;border-radius:50%;background:var(--ec);box-shadow:0 0 0 1.5px rgba(255,255,255,.22)}
.pl-ev-c:hover{background:var(--hover)}
.pl-ev-rs{position:absolute;left:0;right:0;height:7px;cursor:ns-resize}
.pl-ev-rs.top{top:0}
.pl-ev-rs.bot{bottom:0}
.pl-ev.short .pl-ev-rs.top{display:none}
.pl-ev.short .pl-ev-rs.bot{height:5px}
.pl-ghost{position:absolute;left:2px;right:2px;z-index:3;padding:3px 7px;border-radius:6px;border:1.5px dashed var(--accent);background:var(--accent-wash);pointer-events:none;font:500 10px var(--font-mono);color:var(--accent);white-space:nowrap;overflow:hidden}
.pl-foot{flex:none;padding:7px 12px;border-top:1px solid var(--line);border-radius:0 0 12px 12px;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* ---------- popovers, modals, toasts ---------- */
.menu{position:fixed;z-index:6000;min-width:220px;max-width:calc(100vw - 24px);padding:5px;background:var(--pane-2);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 40px -12px var(--shadow)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu-it{width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;text-align:left;font-size:13px;color:var(--text)}
.menu-it:hover:not(:disabled){background:var(--hover)}
.menu-it .i{width:15px;height:15px;color:var(--muted)}
.menu-it span{flex:1}
.menu-it .mk{color:var(--accent)}
.menu-it.danger,.menu-it.danger .i{color:var(--red)}
.menu-it.danger:hover:not(:disabled){background:rgba(239,93,108,.1)}
.menu-it:disabled{opacity:.4;cursor:default}
.pop{position:fixed;z-index:6000;width:276px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;gap:8px;padding:14px 14px 8px;background:var(--pane-2);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 40px -12px var(--shadow)}
.pop-lbl{font:600 10px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pop .txt-in{width:100%;height:32px;margin-bottom:4px}
.pop hr{align-self:stretch;border:0;border-top:1px solid var(--line);margin:4px -6px 0}
.pop .menu-it{margin:0 -6px;width:calc(100% + 12px)}
.dk-sw{display:flex;flex-wrap:wrap;gap:6px;padding:3px 0 5px}
.dk-swb,.dk-custom{position:relative;width:24px;height:24px;border-radius:50%;flex:none}
.dk-swb{background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.dk-swb.on,.dk-custom.on{box-shadow:0 0 0 2px var(--pane-2),0 0 0 3.5px var(--sw)}
.dk-swb.on::after{content:"";position:absolute;left:8.5px;top:5px;width:5px;height:10px;border:solid #0b0b0c;border-width:0 2px 2px 0;transform:rotate(45deg)}
.dk-custom{overflow:hidden;cursor:pointer;background:conic-gradient(#ef5d6c,#f0a033,#e6c24b,#4fc76a,#1a9bd0,#a88bfa,#f472b6,#ef5d6c)}
.dk-custom::after{content:"";position:absolute;inset:6.5px;border-radius:50%;background:var(--sw,#0a0b0c);box-shadow:0 0 0 1.5px var(--pane-2)}
.dk-custom:not(.on)::after{background:var(--pane-2)}
.dk-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.dk-custom:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.dk-warn{font-size:11.5px;line-height:1.45;color:var(--orange)}
.menu-label{padding:6px 10px 2px;font:600 10px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.modal-back{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.66);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--pane);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 80px -20px var(--shadow);padding:20px 22px}
.modal.wide{width:min(560px,100%)}
.modal h2{margin:0 0 10px;font:600 17px var(--font-ui);text-wrap:balance}
.modal-body{font-size:13.5px;color:var(--muted)}
.modal-body p{margin:.4em 0}
.modal-act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.set-sec{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.set-sec:first-child{border-top:0;padding-top:4px}
.set-sec h3{margin:0;font:600 11px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:center;gap:12px;color:var(--text)}
.set-row>label{color:var(--muted);font-size:13px}
.set-row .txt-in{width:100%}
.set-hint{font-size:12px;color:var(--faint);margin-top:-4px}
.set-hint code{font:11.5px var(--font-mono);color:var(--accent)}
.vault-box{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg)}
.vault-box .i{color:var(--purple)}
.vault-box div{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.vault-box strong{display:block;color:var(--text);font-weight:500;font-size:13px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:9px 10px 9px 16px;background:var(--pane-2);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 16px 40px -12px var(--shadow);font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:100%}
.toast.in{opacity:1;transform:none}
.toast.warn{border-color:rgba(240,160,51,.5)}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast button{flex:none;padding:4px 10px;border-radius:7px;color:var(--accent);font-weight:500}
.toast button:hover{background:var(--hover)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<div id="board" data-tool="select">
  <div id="dots"></div>
  <div id="glow"></div>
  <div id="world"></div>
  <canvas id="ink" aria-label="Drawing layer"></canvas>
</div>
<div id="board-hint" hidden><b id="board-hint-name"></b>This desk is empty. Press <kbd>P</kbd> to draw, <kbd>N</kbd> for a post&#8209;it, <kbd>C</kbd> for a card or <kbd>T</kbd> for text.</div>

<nav id="ribbon" aria-label="Dotdesk">
  <div class="rb-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button class="rb" data-toggle="notes" title="Notepad (Alt+1)" aria-label="Notepad"><i data-ico="notebook"></i></button>
  <button class="rb" data-toggle="timer" title="Pomodoro (Alt+2)" aria-label="Pomodoro"><i data-ico="timer"></i></button>
  <button class="rb" data-toggle="tasks" title="Tasks (Alt+3)" aria-label="Tasks"><i data-ico="checks"></i></button>
  <button class="rb" data-toggle="plan" title="Day plan (Alt+4)" aria-label="Day plan"><i data-ico="planner"></i></button>
  <button class="rb" data-toggle="clock" title="Clock and calendar (Alt+5)" aria-label="Clock and calendar"><i data-ico="calendar"></i></button>
  <span class="rb-sep"></span>
  <button class="rb" id="rb-daily" title="Open today's daily note" aria-label="Open today's daily note"><i data-ico="today"></i></button>
  <button class="rb" id="rb-vault" title="Connect your Obsidian vault" aria-label="Obsidian vault"><i data-ico="gem"></i><span class="rb-led" id="rb-led"></span></button>
  <span class="rb-fill"></span>
  <span class="rb-sep"></span>
  <div id="rb-desks" role="tablist" aria-label="Desks"></div>
  <button class="rb rb-add" id="rb-add-desk" title="New desk" aria-label="New desk"><i data-ico="plus"></i></button>
  <span class="rb-sep"></span>
  <button class="rb" id="rb-settings" title="Settings" aria-label="Settings"><i data-ico="sliders"></i></button>
</nav>

<div id="toolbar" role="toolbar" aria-label="Board tools">
  <button class="tb-desk" id="tb-desk" title="Rename this desk or change its accent color" aria-haspopup="dialog"><span class="tb-desk-dot"></span><span class="tb-desk-name" id="tb-desk-name"></span><i data-ico="chevDown"></i></button>
  <span class="tb-sep"></span>
  <div class="tb-grp" id="tb-tools">
    <button class="tb" data-tool="select" title="Select and move (V)" aria-label="Select and move"><i data-ico="pointer"></i></button>
    <button class="tb" data-tool="pen" title="Pen (P) · hold Shift for a straight line" aria-label="Pen"><i data-ico="pen"></i></button>
    <button class="tb" data-tool="hl" title="Highlighter (H)" aria-label="Highlighter"><i data-ico="hl"></i></button>
    <button class="tb" data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><i data-ico="eraser"></i></button>
    <button class="tb" data-tool="text" title="Text (T)" aria-label="Text"><i data-ico="text"></i></button>
    <button class="tb" data-tool="postit" title="Post-it (N)" aria-label="Post-it"><i data-ico="postit"></i></button>
    <button class="tb" data-tool="card" title="Note card (C)" aria-label="Note card"><i data-ico="card"></i></button>
  </div>
  <span class="tb-sep"></span>
  <div class="tb-grp" id="tb-colors" role="group" aria-label="Color"></div>
  <span class="tb-sep"></span>
  <div class="tb-grp" id="tb-sizes" role="group" aria-label="Size"></div>
  <span class="tb-sep"></span>
  <div class="tb-grp">
    <button class="tb" id="tb-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><i data-ico="undo"></i></button>
    <button class="tb" id="tb-redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><i data-ico="redo"></i></button>
  </div>
  <span class="tb-sep"></span>
  <div class="tb-grp">
    <button class="tb tb-zoom" id="tb-zoom" title="Reset zoom to 100%">100%</button>
    <button class="tb" id="tb-fit" title="Fit everything on the board into view" aria-label="Fit board"><i data-ico="focus"></i></button>
    <button class="tb" id="tb-clear" title="Clear the board" aria-label="Clear the board"><i data-ico="trash"></i></button>
  </div>
</div>
<div id="examples" hidden><span>Showing example content</span><button id="ex-clear">Clear examples</button><button id="ex-keep">Keep</button></div>

<section class="win" id="w-notes" data-win="notes" aria-label="Notepad" hidden>
  <header class="win-bar">
    <i data-ico="notebook"></i><h2>Notepad</h2>
    <div class="seg" id="np-mode" role="group" aria-label="View">
      <button data-mode="edit" title="Source only" aria-label="Source only"><i data-ico="penline"></i></button>
      <button data-mode="split" title="Source and preview" aria-label="Source and preview"><i data-ico="columns"></i></button>
      <button data-mode="read" title="Reading view" aria-label="Reading view"><i data-ico="eye"></i></button>
    </div>
    <div class="win-act">
      <button class="ib" data-min title="Minimize" aria-label="Minimize"><i data-ico="minus"></i></button>
      <button class="ib" data-close title="Close" aria-label="Close"><i data-ico="x"></i></button>
    </div>
  </header>
  <div class="win-body">
    <div class="np-tabs"><div id="np-tablist" role="tablist" aria-label="Open notes"></div><button class="ib np-add" id="np-new" title="New note" aria-label="New note"><i data-ico="plus"></i></button></div>
    <div class="np-crumb" id="np-crumb"></div>
    <div class="np-panes" id="np-panes" data-mode="split">
      <textarea id="np-src" spellcheck="true" aria-label="Markdown source" placeholder="Write in Markdown. Ctrl+Enter appends it to today's daily note."></textarea>
      <div id="np-prev" class="md" aria-label="Preview"></div>
    </div>
    <footer class="np-foot">
      <span class="np-info" id="np-info"></span>
      <button class="ib" id="np-more" title="More actions" aria-label="More actions"><i data-ico="more"></i></button>
      <button class="btn" id="np-save" title="Save to your vault (Ctrl+S)"><i data-ico="save"></i><span>Save as note</span></button>
      <button class="btn primary" id="np-append" title="Append to today's daily note (Ctrl+Enter)"><i data-ico="today"></i>Append to today</button>
    </footer>
  </div>
  <div class="win-rs" aria-hidden="true"></div>
</section>

<section class="win" id="w-timer" data-win="timer" aria-label="Pomodoro timer" hidden>
  <header class="win-bar">
    <i data-ico="timer"></i><h2>Pomodoro</h2>
    <div class="win-act">
      <button class="ib" id="pm-cfg-btn" title="Timer settings" aria-label="Timer settings"><i data-ico="sliders"></i></button>
      <button class="ib" data-min title="Minimize" aria-label="Minimize"><i data-ico="minus"></i></button>
      <button class="ib" data-close title="Close" aria-label="Close"><i data-ico="x"></i></button>
    </div>
  </header>
  <div class="win-body pm" id="pm" data-mode="focus">
    <div class="pm-main" id="pm-main">
      <div class="seg pm-modes" id="pm-modes" role="group" aria-label="Timer mode">
        <button data-mode="focus">Focus</button><button data-mode="short">Short break</button><button data-mode="long">Long break</button>
      </div>
      <div class="pm-ring">
        <svg viewBox="0 0 220 220" aria-hidden="true"><g id="pm-ticks"></g><circle class="pm-trk" cx="110" cy="110" r="88"/><circle class="pm-prog" id="pm-prog" cx="110" cy="110" r="88"/></svg>
        <div class="pm-center"><div class="pm-time" id="pm-time" role="timer"></div><div class="pm-label" id="pm-label"></div></div>
      </div>
      <div class="pm-ctrl">
        <button class="ib lg" id="pm-reset" title="Reset this session" aria-label="Reset this session"><i data-ico="reset"></i></button>
        <button class="pm-go" id="pm-go" aria-label="Start"><i data-ico="play"></i></button>
        <button class="ib lg" id="pm-skip" title="Skip to the next session" aria-label="Skip to the next session"><i data-ico="skip"></i></button>
      </div>
      <div class="pm-foot"><span class="pm-dots" id="pm-dots" aria-label="Sessions in this cycle"></span><span id="pm-today"></span></div>
    </div>
    <form class="pm-form" id="pm-form" hidden>
      <h3>Durations</h3>
      <div class="fld-row"><label for="pm-f-focus">Focus</label><div class="num"><input id="pm-f-focus" type="number" min="1" max="240" inputmode="numeric"><span>min</span></div></div>
      <div class="fld-row"><label for="pm-f-short">Short break</label><div class="num"><input id="pm-f-short" type="number" min="1" max="120" inputmode="numeric"><span>min</span></div></div>
      <div class="fld-row"><label for="pm-f-long">Long break</label><div class="num"><input id="pm-f-long" type="number" min="1" max="180" inputmode="numeric"><span>min</span></div></div>
      <div class="fld-row"><label for="pm-f-every">Long break after</label><div class="num"><input id="pm-f-every" type="number" min="2" max="12" inputmode="numeric"><span>focus</span></div></div>
      <h3 style="margin-top:6px">Flow</h3>
      <label class="chk"><input type="checkbox" id="pm-f-ab"><span>Start breaks automatically</span></label>
      <label class="chk"><input type="checkbox" id="pm-f-af"><span>Start the next focus automatically</span></label>
      <label class="chk"><input type="checkbox" id="pm-f-nt"><span>Show a desktop notification</span></label>
      <h3 style="margin-top:6px">Sound</h3>
      <div class="fld-row"><label for="pm-f-snd">Chime</label><select id="pm-f-snd"><option value="bell">Soft bell</option><option value="chime">Wind chime</option><option value="bowl">Singing bowl</option><option value="digital">Digital beeps</option></select></div>
      <div class="fld-row"><label for="pm-f-vol">Volume</label><input type="range" id="pm-f-vol" min="0" max="1" step="0.05"></div>
      <div class="pm-form-act"><button type="button" class="btn" id="pm-test"><i data-ico="bell"></i>Play chime</button><button type="submit" class="btn primary">Done</button></div>
    </form>
  </div>
</section>

<section class="win" id="w-tasks" data-win="tasks" aria-label="Tasks" hidden>
  <header class="win-bar">
    <i data-ico="checks"></i><h2>Tasks</h2><span class="win-meta" id="tk-sum"></span>
    <div class="win-act">
      <button class="ib" id="tk-more" title="Task options" aria-label="Task options"><i data-ico="more"></i></button>
      <button class="ib" data-min title="Minimize" aria-label="Minimize"><i data-ico="minus"></i></button>
      <button class="ib" data-close title="Close" aria-label="Close"><i data-ico="x"></i></button>
    </div>
  </header>
  <div class="win-body tk-wrap"><div class="tk" id="tk-cols"></div></div>
  <div class="win-rs" aria-hidden="true"></div>
</section>

<section class="win" id="w-plan" data-win="plan" aria-label="Day plan" hidden>
  <header class="win-bar">
    <i data-ico="planner"></i><h2>Day plan</h2>
    <div class="win-act">
      <button class="ib" id="pl-more" title="Day plan options" aria-label="Day plan options"><i data-ico="more"></i></button>
      <button class="ib" data-min title="Minimize" aria-label="Minimize"><i data-ico="minus"></i></button>
      <button class="ib" data-close title="Close" aria-label="Close"><i data-ico="x"></i></button>
    </div>
  </header>
  <div class="win-body">
    <div class="pl-head">
      <button class="ib sm" id="pl-prev" title="Previous day" aria-label="Previous day"><i data-ico="chevL"></i></button>
      <div class="pl-date" id="pl-date"></div>
      <button class="ib sm" id="pl-next" title="Next day" aria-label="Next day"><i data-ico="chevR"></i></button>
      <button class="ck-today" id="pl-today" title="Back to today">Today</button>
    </div>

/* =====================================================================
   Dates
   ===================================================================== */
const DOWS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const weekStartOf = (d, ws) => { const s = sod(d); return addDays(s, -((s.getDay() - ws + 7) % 7)); };
const dayDiff = (a, b) => Math.round((sod(a) - sod(b)) / 864e5);
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function fmt(d, f) {
  return f.replace(/\[([^\]]*)\]|YYYY|YY|MMMM|MMM|MM|M|DD|D|dddd|ddd|dd|HH|H|mm|ss/g, (m, lit) => {
    if (lit !== undefined) return lit;
    switch (m) {
      case 'YYYY': return d.getFullYear();
      case 'YY': return String(d.getFullYear()).slice(-2);
      case 'MMMM': return MONS[d.getMonth()];
      case 'MMM': return MONS[d.getMonth()].slice(0, 3);
      case 'MM': return pad(d.getMonth() + 1);
      case 'M': return d.getMonth() + 1;
      case 'DD': return pad(d.getDate());
      case 'D': return d.getDate();
      case 'dddd': return DOWS[d.getDay()];
      case 'ddd': return DOWS[d.getDay()].slice(0, 3);
      case 'dd': return DOWS[d.getDay()].slice(0, 2);
      case 'HH': return pad(d.getHours());
      case 'H': return d.getHours();
      case 'mm': return pad(d.getMinutes());
      case 'ss': return pad(d.getSeconds());
    }
    return m;
  });
}

/* =====================================================================
   Obsidian bridge: URIs + vault folder access
   ===================================================================== */
function obsUri(action, params) {
  const all = Object.assign({ vault: S.vaultName }, params);
  const q = Object.entries(all).filter(([, v]) => v !== undefined && v !== null && v !== '')
    .map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  return `obsidian://${action}?${q}`;
}
function openUri(u) {
  const a = document.createElement('a');
  a.href = u; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
async function sendToObsidian(path, content, { append = false, overwrite = false } = {}) {
  const params = { file: path.replace(/\.md$/i, '') };
  if (append) params.append = 'true';
  if (overwrite) params.overwrite = 'true';
  if (content.length > 1800 && navigator.clipboard) {
    try { await navigator.clipboard.writeText(content); params.clipboard = 'true'; }
    catch (e) { params.content = content; }
  } else params.content = content;
  openUri(obsUri('new', params));
}

const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('dotdesk', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
};

const Vault = {
  supported: typeof window.showDirectoryPicker === 'function',
  handle: null,
  perm: 'none',
  async init() {
    if (!this.supported) return this.ui();
    try {
      const h = await IDB.get('vault');
      if (h) { this.handle = h; this.perm = await h.queryPermission({ mode: 'readwrite' }); }
    } catch (e) { /* storage unavailable */ }
    this.ui();
    if (this.ready()) Cal.invalidate();
  },
  ready() { return !!this.handle && this.perm === 'granted'; },
  async usable() {
    if (!this.handle) return false;
    if (this.perm === 'granted') return true;
    try { this.perm = await this.handle.requestPermission({ mode: 'readwrite' }); } catch (e) { return false; }
    this.ui();
    if (this.perm === 'granted') Cal.invalidate();
    return this.perm === 'granted';
  },
  async connect() {
    if (!this.supported) {
      toast('Folder access needs Chrome or Edge. Notes still reach Obsidian through obsidian:// links.', { kind: 'warn', ms: 7000 });
      return false;
    }
    let h;
    try { h = await window.showDirectoryPicker({ id: 'dotdesk-vault', mode: 'readwrite' }); }
    catch (e) {
      if (e.name === 'AbortError') return false;
      toast("This page isn't allowed to open folders. Open the downloaded Dotdesk file in Chrome or Edge to connect your vault.", { kind: 'warn', ms: 8000 });
      return false;
    }
    this.handle = h; this.perm = 'granted';
    try { await IDB.set('vault', h); } catch (e) { /* remembered for this session only */ }
    S.vaultName = h.name;
    let msg = `Connected to ${h.name}.`;
    try {
      await h.getDirectoryHandle('.obsidian');
      const cfg = await this.read('.obsidian/daily-notes.json');
      if (cfg) {
        const c = JSON.parse(cfg);
        if (c.folder !== undefined) S.dailyFolder = c.folder || '';
        if (c.format) S.dailyFormat = c.format;
        S.dailyTemplate = c.template || '';
        msg += ` Daily notes go to ${dailyPath(new Date())}.`;
      }
    } catch (e) {
      msg += " There's no .obsidian folder here, so check that you picked the vault's top folder.";
    }
    saveSettings(); this.ui(); Cal.invalidate(); Notes.renderCrumb();
    toast(msg, { ms: 7000 });
    return true;
  },
  async disconnect() {
    this.handle = null; this.perm = 'none';
    try { await IDB.del('vault'); } catch (e) { }
    this.ui(); Cal.invalidate();
  },
  async dirOf(parts, create) {
    let dir = this.handle;
    for (const p of parts) dir = await dir.getDirectoryHandle(p, { create });
    return dir;
  },
  async read(path) {
    const parts = path.split('/').filter(Boolean);
    try {
      const dir = await this.dirOf(parts.slice(0, -1), false);
      const fh = await dir.getFileHandle(parts[parts.length - 1]);
      return await (await fh.getFile()).text();
    } catch (e) {
      if (e.name === 'NotFoundError' || e.name === 'TypeMismatchError') return null;
      throw e;
    }
  },
  async write(path, text) {
    const parts = path.split('/').filter(Boolean);
    const dir = await this.dirOf(parts.slice(0, -1), true);
    const fh = await dir.getFileHandle(parts[parts.length - 1], { create: true });
    const w = await fh.createWritable();
    await w.write(text); await w.close();
  },
  async names(dirPath) {
    const set = new Set();
    try {
      const dir = await this.dirOf(dirPath.split('/').filter(Boolean), false);
      for await (const [name, h] of dir.entries()) if (h.kind === 'file') set.add(name);
    } catch (e) { }
    return set;
  },
  ui() {
    const led = $('#rb-led'), btn = $('#rb-vault');
    led.className = 'rb-led' + (this.ready() ? ' ok' : this.handle ? ' wait' : '');
    btn.title = this.ready() ? `Vault connected: ${this.handle.name}` : this.handle ? `Click to reconnect ${this.handle.name}` : 'Connect your Obsidian vault folder';
    const box = $('#vault-box');
    if (box) renderVaultBox(box);
  }
};

async function dailyTemplate(d) {
  if (!S.dailyTemplate || !Vault.ready()) return '';

    if (t == null) return '';

      k === 'title' ? baseName(dailyPath(d)) : fmt(k === 'time' ? new Date() : d, f || (k === 'date' ? 'YYYY-MM-DD' : 'HH:mm')));

/* =====================================================================
   Markdown (Obsidian flavoured: tasks, ==highlight==, [[links]], #tags, callouts)
   ===================================================================== */
function mdInline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s);
